<!doctype html><html lang="nl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kroket God — Dashboard</title>
<style>
  :root{--bg:#120c06;--card:#221809;--card2:#2a1e0c;--gold:#f0c060;--gold2:#caa047;--amber:#e08a2a;--txt:#f6ead0;--dim:#b89c72;--green:#7fd07f;--red:#e07a5a;--line:#4a3618;--glow:rgba(240,192,96,.45)}
  *{box-sizing:border-box}html,body{margin:0}
  body{color:var(--txt);font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:
    radial-gradient(1100px 560px at 50% -8%,rgba(224,138,42,.20),transparent 60%),
    radial-gradient(900px 520px at 50% 108%,rgba(202,160,71,.10),transparent 60%),var(--bg);background-attachment:fixed}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;z-index:0;
    background-image:radial-gradient(rgba(240,192,96,.10) 1px,transparent 1.5px),radial-gradient(rgba(224,138,42,.07) 1px,transparent 1.5px);
    background-size:7px 7px,12px 12px;background-position:0 0,3px 5px}
  .wrap{position:relative;z-index:1}
  /* centraal watermerk: grote, vervaagde Kroket God achter alle kaarten */
  .watermark{position:absolute;inset:0;z-index:0;pointer-events:none;
    background:url('/kroketgod.png') center 54% no-repeat;background-size:min(720px,82vw) auto;opacity:.16;
    -webkit-mask:radial-gradient(circle at center 54%,#000 24%,transparent 66%);mask:radial-gradient(circle at center 54%,#000 24%,transparent 66%)}
  main{position:relative;z-index:1}
  /* boxed op desktop: gecentreerde, omkaderde box met de achtergrond eromheen */
  @media(min-width:980px){
    body{padding:0 20px}
    .wrap{max-width:1200px;margin:24px auto;border:1px solid var(--line);border-radius:18px;overflow:hidden;
      background:linear-gradient(180deg,rgba(26,18,8,.6),rgba(18,12,6,.5));
      box-shadow:0 22px 70px rgba(0,0,0,.55),0 0 0 1px rgba(240,192,96,.06) inset}
  }
  /* hero */
  .hero{position:relative;z-index:1;text-align:center;padding:20px 16px 14px;overflow:hidden;border-bottom:1px solid var(--line)}
  .halo{position:absolute;left:50%;top:2px;width:380px;height:380px;max-width:84vw;transform:translateX(-50%);z-index:0;filter:blur(4px);
    background:radial-gradient(circle,rgba(240,192,96,.5),rgba(224,138,42,.14) 45%,transparent 70%);animation:pulse 4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.7;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.07)}}
  .god{position:relative;z-index:2;width:184px;height:184px;border-radius:50%;object-fit:cover;background:#1a1208;
    border:3px solid var(--gold);box-shadow:0 0 0 7px rgba(240,192,96,.10),0 0 44px var(--glow)}
  .godph{align-items:center;justify-content:center;font-size:92px}
  .crown{position:relative;z-index:2;margin:13px 0 1px;font-family:Georgia,'Times New Roman',serif;font-weight:700;
    font-size:clamp(22px,4vw,30px);letter-spacing:3px;color:var(--gold);text-shadow:0 0 22px var(--glow),0 2px 0 #5a3c10}
  .sub{position:relative;z-index:2;color:var(--dim);letter-spacing:4px;text-transform:uppercase;font-size:10px;margin-bottom:10px}
  .pills{position:relative;z-index:2;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .bolt{position:absolute;top:-10px;z-index:1;width:64px;height:200px;opacity:0;filter:drop-shadow(0 0 7px var(--gold));animation:flash 7s infinite}
  .bolt.l{left:6%}.bolt.r{right:6%;transform:scaleX(-1)}
  .bolt.l2{left:22%;animation-delay:2.3s}.bolt.r2{right:22%;transform:scaleX(-1);animation-delay:4.1s}
  @keyframes flash{0%,100%{opacity:0}1.5%{opacity:1}3%{opacity:.15}5%{opacity:.95}8%{opacity:0}}
  .pill{padding:4px 12px;border-radius:99px;font-size:12px;font-weight:600;background:rgba(42,30,12,.85);border:1px solid var(--line);color:var(--txt)}
  .pill.on{color:var(--green);border-color:var(--green)}.pill.off{color:var(--red);border-color:var(--red)}
  main{padding:11px 13px;max-width:none;margin:0 auto}
  /* masonry: kaarten vullen verticaal op, geen lege gaten onder kortere kaarten */
  .cards{column-width:244px;column-gap:10px}
  #instellingen{margin-bottom:10px}
  .setgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
  .lbl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
  .info{display:inline-block;width:15px;height:15px;line-height:14px;text-align:center;border-radius:50%;border:1px solid var(--gold2);color:var(--gold);font-size:10px;font-weight:700;font-style:italic;cursor:help;margin-left:5px;position:relative;vertical-align:middle;text-transform:none;letter-spacing:0}
  .info:hover{background:var(--gold2);color:#1a1208}
  .info:hover::after{content:attr(data-tip);position:absolute;left:50%;bottom:150%;transform:translateX(-50%);width:240px;max-width:70vw;background:#16100a;color:var(--txt);border:1px solid var(--gold2);border-radius:8px;padding:8px 11px;font-size:12px;font-weight:400;font-style:normal;line-height:1.45;text-align:left;box-shadow:0 8px 22px rgba(0,0,0,.55);z-index:20;white-space:normal}
  .info:hover::before{content:"";position:absolute;left:50%;bottom:150%;transform:translate(-50%,99%);border:6px solid transparent;border-top-color:var(--gold2);z-index:20}
  .tog{display:block;padding:2px 0;font-size:13px;cursor:pointer}.tog input{vertical-align:middle;margin-right:6px;accent-color:var(--amber)}
  .numl{display:block;font-size:13px;margin:2px 0}.numl input{width:54px;background:#16100a;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:2px 6px;margin:0 4px}
  select,textarea{width:100%;background:#16100a;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit}
  .btn{background:#2c2010;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font:inherit;cursor:pointer;margin:2px 2px}
  .btn:hover{border-color:var(--gold)}.btn.gold{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#1a1208;border-color:var(--gold);font-weight:700}
  .card{position:relative;break-inside:avoid;margin-bottom:10px;background:linear-gradient(180deg,rgba(42,30,12,.86),rgba(34,24,9,.86));border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 1px 0 rgba(240,192,96,.06) inset,0 6px 16px rgba(0,0,0,.4)}
  .card h2{margin:0 0 6px;padding-bottom:5px;border-bottom:1px solid var(--line);font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--gold);text-shadow:0 0 12px rgba(240,192,96,.25)}
  table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:2px 5px;border-bottom:1px solid rgba(74,54,24,.6);font-size:13px}
  th{color:var(--dim);font-weight:600;font-size:11px}tr:last-child td{border-bottom:0}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .prov{display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px solid rgba(74,54,24,.6);font-size:13px}.prov:last-child{border:0}
  .dot{display:inline-block;width:9px;height:9px;border-radius:99px;margin-right:7px;vertical-align:middle;box-shadow:0 0 6px currentColor}
  .dot.ok{background:var(--green);color:var(--green)}.dot.cool{background:var(--gold);color:var(--gold)}.dot.off{background:#5a4a30;color:transparent}
  .tier{font-size:11px;color:var(--dim);margin-left:6px}
  .bar{height:7px;background:#16100a;border-radius:99px;overflow:hidden;margin-top:3px;border:1px solid var(--line)}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--gold))}
  /* grafieken */
  .vbars{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:5px;padding-top:13px}
  .vbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
  .vbar i{position:relative;width:100%;min-height:3px;border-radius:4px 4px 0 0;display:block;
    background:linear-gradient(180deg,var(--gold),var(--amber));box-shadow:0 0 10px rgba(224,138,42,.35)}
  .vbar i b{position:absolute;top:-15px;left:0;right:0;text-align:center;font-size:11px;color:var(--gold);font-weight:700}
  .vbar i b.zero{color:var(--dim);font-weight:400}
  .vbar span{font-size:11px;color:var(--dim);margin-top:5px}
  .hbar{display:flex;align-items:center;gap:8px;padding:3px 0}
  .hbar .hl{width:34%;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hbar .ht{flex:1;height:10px;background:#16100a;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .hbar .ht i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--amber),var(--gold))}
  .hbar .hn{width:30px;text-align:right;font-variant-numeric:tabular-nums;font-size:12px;color:var(--txt)}
  /* ranglijst: één gestapelde balk per lid — roempunten (navy) + kroketpunten (goud) */
  .rlg{display:flex;gap:14px;margin-bottom:9px;font-size:12px;color:var(--dim)}
  .rlg span{display:flex;align-items:center;gap:5px}.rlg i{width:11px;height:11px;border-radius:3px}
  .sw-kroket{background:linear-gradient(90deg,var(--amber),var(--gold))}
  .sw-roem{background:linear-gradient(90deg,#2e3192,#4348c4)}
  .rrow{padding:5px 0;border-bottom:1px solid rgba(74,54,24,.4)}.rrow:last-child{border:0}
  .rrow .rn{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;margin-bottom:3px}
  .rrow .rn .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rrow .rn .vals{flex:0 0 auto;font-variant-numeric:tabular-nums;font-weight:600}
  .rrow .rn .vk{color:var(--gold)}.rrow .rn .vr{color:#9aa0e8}
  .sbar{display:flex;height:14px;background:#16100a;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .sbar .seg{height:100%}
  .sbar .seg.roem{background:linear-gradient(90deg,#2e3192,#4348c4)}
  .sbar .seg.kroket{background:linear-gradient(90deg,var(--amber),var(--gold))}
  .donut{display:flex;align-items:center;gap:12px;margin-top:5px;flex-wrap:wrap}
  .donut .ring{width:86px;height:86px;border-radius:99px;flex:0 0 auto;position:relative;
    -webkit-mask:radial-gradient(circle 27px at 50% 50%,transparent 98%,#000);mask:radial-gradient(circle 27px at 50% 50%,transparent 98%,#000)}
  .donut .ring.empty{background:#16100a;border:1px solid var(--line)}
  .donut .leg{flex:1;min-width:120px}
  .donut .leg .li{display:flex;align-items:center;gap:6px;padding:2px 0;font-size:12px}
  .donut .leg .sw{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
  .donut .leg .ln{margin-left:auto;color:var(--dim);font-variant-numeric:tabular-nums}
  .lc{width:100%;height:auto;display:block;margin-top:4px;overflow:visible}
  .llg{display:flex;gap:14px;flex-wrap:wrap;margin-top:7px;font-size:12px;color:var(--dim)}
  .llg i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
  .axis{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:3px}
  .lc-empty{color:var(--dim);font-size:13px;padding:18px 0;text-align:center}
  .feed{max-height:260px;overflow:auto}.feed .row{padding:3px 0;border-bottom:1px solid rgba(74,54,24,.5);font-size:12px}.feed .row:last-child{border:0}
  /* ingeplande berichten */
  .sched{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px solid rgba(74,54,24,.45)}.sched:last-child{border:0}
  .sched .when{flex:0 0 auto;width:96px;font-size:11px;line-height:1.3}
  .sched .when b{color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums}
  .sched .when span{color:var(--dim);display:block}
  .sched .body{flex:1;min-width:0;font-size:12.5px}
  .sched .body .tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:99px;margin-bottom:2px;border:1px solid var(--line);color:var(--dim);text-transform:uppercase;letter-spacing:.4px}
  .sched .body .tag.terug{color:var(--gold2);border-color:var(--gold2)}
  .sched .body .tag.eenm{color:#9aa0e8;border-color:#5358b0}
  .sched .body .lbl2{color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .sched .skip{flex:0 0 auto;background:#2c2010;color:var(--dim);border:1px solid var(--line);border-radius:7px;padding:3px 8px;font-size:11px;cursor:pointer}
  .sched .skip:hover{border-color:var(--red);color:var(--red)}
  .feed .t{color:var(--dim);font-size:11px}.muted{color:var(--dim)}.big{font-size:26px;color:var(--gold);font-weight:700}
  /* tab-navigatie (2.0): sticky balk onder de hero */
  .tabs{position:sticky;top:0;z-index:30;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:9px 4px;margin:-11px -13px 10px;
    background:linear-gradient(180deg,rgba(18,12,6,.97),rgba(18,12,6,.9));backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  .tab{background:#221809;border:1px solid var(--line);color:var(--dim);border-radius:99px;padding:6px 14px;font:inherit;font-size:12.5px;cursor:pointer;letter-spacing:.4px}
  .tab:hover{border-color:var(--gold);color:var(--txt)}
  .tab.act{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#1a1208;border-color:var(--gold);font-weight:700;box-shadow:0 0 14px rgba(240,192,96,.35)}
  .tab .cnt{display:inline-block;min-width:16px;margin-left:5px;padding:0 4px;border-radius:99px;background:rgba(0,0,0,.25);font-size:10px;font-weight:700;vertical-align:middle}
  .tabpane{display:none}.tabpane.act{display:block}
  /* KPI-tegels (2.0) */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin-bottom:10px}
  .kpi{background:linear-gradient(180deg,rgba(42,30,12,.9),rgba(34,24,9,.9));border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.35)}
  .kpi .v{font-size:24px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;text-shadow:0 0 14px rgba(240,192,96,.3)}
  .kpi .l{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.7px;margin-top:2px}
  /* logs-zoekfilter (2.0) */
  .zoek{width:100%;background:#16100a;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font:inherit;margin-bottom:10px}
  .zoek:focus{outline:none;border-color:var(--gold2)}
  footer{text-align:center;color:var(--dim);font-size:12px;padding:16px}footer a{color:var(--gold2)}
</style><style>#login_overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999;align-items:center;justify-content:center;}#login_box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:32px;min-width:300px;display:flex;flex-direction:column;gap:12px;}#login_box h2{margin:0;color:var(--amber);font-size:1.1rem;}#login_token{background:var(--bg);border:1px solid var(--border);color:var(--fg);border-radius:6px;padding:8px 12px;font-size:.9rem;width:100%;box-sizing:border-box;}#login_btn{background:var(--amber);color:#000;border:none;border-radius:6px;padding:10px;font-weight:700;cursor:pointer;}</style></head><body><div id="login_overlay"><div id="login_box"><h2>⚜️ Dashboard — Toegangscode vereist</h2><input id="login_token" type="password" placeholder="DASHBOARD_TOKEN" onkeydown="if(event.key==='Enter')saveToken()"><button id="login_btn" onclick="saveToken()">Bevestigen</button></div></div><div class="wrap">
<div class="watermark" id="watermark"></div>
<div class="hero">
  <div class="halo"></div>
  <svg class="bolt l" viewBox="0 0 40 200"><path d="M26 2 L9 96 L21 96 L5 198 L33 82 L20 82 Z" fill="#f0c060"/></svg>
  <svg class="bolt r" viewBox="0 0 40 200"><path d="M26 2 L9 96 L21 96 L5 198 L33 82 L20 82 Z" fill="#f0c060"/></svg>
  <svg class="bolt l2" viewBox="0 0 40 200"><path d="M24 2 L11 90 L20 90 L7 198 L31 86 L21 86 Z" fill="#caa047"/></svg>
  <svg class="bolt r2" viewBox="0 0 40 200"><path d="M24 2 L11 90 L20 90 L7 198 L31 86 L21 86 Z" fill="#caa047"/></svg>
  <img class="god" id="godimg" src="/kroketgod.png" alt="Kroket God" onerror="this.style.display='none';document.getElementById('godph').style.display='flex'">
  <div class="god godph" id="godph" style="display:none">⚜️</div>
  <div class="crown">KROKET GOD</div>
  <div class="sub">Dashboard der Hoge Frituurraad</div>
  <div class="pills">
    <span class="pill" id="status">…</span>
    <span class="pill" id="uptime"></span>
    <span class="pill" id="mood"></span>
    <span class="pill" id="vrijdag"></span>
  </div>
  <div class="muted" id="updated" style="margin-top:9px;font-size:11px"></div>
</div>
<main>
<nav class="tabs" id="tabs">
  <button class="tab act" data-tab="overzicht">📊 Overzicht</button>
  <button class="tab" data-tab="spel">🎮 Spel</button>
  <button class="tab" data-tab="llm">🤖 LLM &amp; systeem</button>
  <button class="tab" data-tab="beheer">🛠️ Beheer</button>
  <button class="tab" data-tab="logs">📜 Logs</button>
</nav>
<section class="tabpane act" id="tab-overzicht"><div class="kpis" id="kpis"></div><div class="cards" id="c_overzicht"><div class="card">Laden…</div></div></section>
<section class="tabpane" id="tab-spel"><div class="cards" id="c_spel"></div></section>
<section class="tabpane" id="tab-llm"><div class="cards" id="c_llm"></div></section>
<section class="tabpane" id="tab-beheer"><div id="instellingen"></div><div id="personas"></div><div class="cards" id="c_beheer"></div></section>
<section class="tabpane" id="tab-logs"><input class="zoek" id="logzoek" placeholder="🔎 filter de logs — naam, type, tekst…" oninput="filterLogs()"><div class="cards" id="c_logs"></div></section>
</main>
<footer>⚜️ Ververst automatisch · /api/stats (token vereist)</footer></div>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function dur(s){s=Math.max(0,s|0);var d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);if(d>0)return d+'d '+h+'u';if(h>0)return h+'u '+m+'m';if(m>0)return m+'m';return s+'s';}
function pct(a,b){a=parseFloat(a);b=parseFloat(b);if(!b||isNaN(a)||isNaN(b))return 0;return Math.max(0,Math.min(100,Math.round(a/b*100)));}
function card(title,inner){return '<div class="card"><h2>'+title+'</h2>'+inner+'</div>';}
function tip(t){return ' <span class="info" data-tip="'+String(t).replace(/"/g,'&quot;')+'" onclick="event.preventDefault()">i</span>';}
var CHART_KLEUREN=['#f0c060','#e08a2a','#caa047','#d98f5a','#b8863f','#e0b070','#a8702a','#8a6a3a'];
// Verticale staafgrafiek: data = [{label, value}]
function vbars(data){
  var max=1;data.forEach(function(d){if(d.value>max)max=d.value;});
  return '<div class="vbars">'+data.map(function(d){
    var h=Math.round(d.value/max*100);
    return '<div class="vbar"><i style="height:'+(d.value?Math.max(h,4):0)+'%"><b'+(d.value?'':' class="zero"')+'>'+d.value+'</b></i><span>'+esc(d.label)+'</span></div>';
  }).join('')+'</div>';
}
// Horizontale balkjes: data = [{label, value}]
function hbars(data,leeg){
  if(!data.length)return '<div class="muted">'+(leeg||'geen data')+'</div>';
  var max=1;data.forEach(function(d){if(d.value>max)max=d.value;});
  return data.map(function(d){
    var w=Math.max(2,Math.round(d.value/max*100));
    return '<div class="hbar"><span class="hl">'+esc(d.label)+'</span><span class="ht"><i style="width:'+w+'%"></i></span><span class="hn">'+d.value+'</span></div>';
  }).join('');
}
// Donut + legenda: data = [{label, value}]
function donut(data,leeg){
  var tot=0;data.forEach(function(d){tot+=d.value;});
  if(!tot)return '<div class="donut"><div class="ring empty"></div><div class="leg muted">'+(leeg||'geen data')+'</div></div>';
  var acc=0,segs=[],leg='';
  data.forEach(function(d,i){
    var col=CHART_KLEUREN[i%CHART_KLEUREN.length];
    var van=acc/tot*360,naar=(acc+d.value)/tot*360;acc+=d.value;
    segs.push(col+' '+van.toFixed(1)+'deg '+naar.toFixed(1)+'deg');
    leg+='<div class="li"><span class="sw" style="background:'+col+'"></span>'+esc(d.label)+'<span class="ln">'+d.value+' · '+Math.round(d.value/tot*100)+'%</span></div>';
  });
  return '<div class="donut"><div class="ring" style="background:conic-gradient('+segs.join(',')+')"></div><div class="leg">'+leg+'</div></div>';
}
// Lijngrafiek (SVG). series=[{naam,kleur,data:[getallen|null]}], opts={area,labels:[links,rechts],legenda}
function lineChart(series,opts){
  opts=opts||{};
  var n=0;series.forEach(function(s){if(s.data.length>n)n=s.data.length;});
  if(n<2)return '<div class="lc-empty">te weinig data — de trend vult zich naarmate de dagen verstrijken</div>';
  var max=0,heeft=false;
  series.forEach(function(s){s.data.forEach(function(v){if(v!=null){heeft=true;if(v>max)max=v;}});});
  if(!heeft)return '<div class="lc-empty">nog geen meetwaarden</div>';
  if(max<=0)max=1;
  var W=300,H=104,pl=3,pr=3,pt=8,pb=6;
  function X(i){return pl+(W-pl-pr)*(n<2?0:i/(n-1));}
  function Y(v){return pt+(H-pt-pb)*(1-v/max);}
  var svg='<svg class="lc" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">';
  series.forEach(function(s,si){
    var pts=[],first=-1,last=-1;
    s.data.forEach(function(v,i){if(v!=null){pts.push(X(i)+','+Y(v));if(first<0)first=i;last=i;}});
    if(!pts.length)return;
    if(opts.area&&si===0){
      svg+='<polygon points="'+X(first)+','+(H-pb)+' '+pts.join(' ')+' '+X(last)+','+(H-pb)+'" fill="'+s.kleur+'" opacity="0.15"/>';
    }
    svg+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+s.kleur+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>';
    var le=pts[pts.length-1].split(',');
    svg+='<circle cx="'+le[0]+'" cy="'+le[1]+'" r="2.6" fill="'+s.kleur+'" vector-effect="non-scaling-stroke"/>';
  });
  svg+='</svg>';
  var out=svg;
  if(opts.labels)out+='<div class="axis"><span>'+esc(opts.labels[0])+'</span><span>'+esc(opts.labels[1])+'</span></div>';
  if(opts.legenda&&series.length)out+='<div class="llg">'+series.map(function(s){return '<span><i style="background:'+s.kleur+'"></i>'+esc(s.naam)+'</span>';}).join('')+'</div>';
  return out;
}
function kortDatum(s){var p=String(s||'').split('-');return p.length===3?(+p[2])+'/'+(+p[1]):s;}
// Ranglijst: één gestapelde balk per lid — roempunten (navy) + kroketpunten van deze week (goud).
// data=[{naam,score,roem}]. Schaal gedeeld op de grootste (roem+kroket)-som.
function ranglijstChart(data,leeg){
  if(!data.length)return '<div class="muted">'+(leeg||'nog geen scores')+'</div>';
  var max=1;data.forEach(function(r){max=Math.max(max,(r.score||0)+(r.roem||0));});
  var leg='<div class="rlg"><span><i class="sw-kroket"></i>kroketpunten (deze week)</span><span><i class="sw-roem"></i>roempunten (totaal)</span></div>';
  var rows=data.map(function(r){
    var k=r.score||0,rm=r.roem||0;
    var kw=k>0?Math.max(1.5,k/max*100):0,rw=rm>0?Math.max(1.5,rm/max*100):0;
    return '<div class="rrow"><div class="rn"><span class="nm">'+esc(r.naam)+'</span>'
      +'<span class="vals"><span class="vk">'+k+'</span> · <span class="vr">'+rm+'</span></span></div>'
      +'<div class="sbar"><i class="seg roem" style="width:'+rw.toFixed(1)+'%"></i><i class="seg kroket" style="width:'+kw.toFixed(1)+'%"></i></div></div>';
  }).join('');
  return leg+rows;
}

var _wizardVragen=[];
function personaVragen(){
  var naam=document.getElementById('p_naam').value.trim();
  var st=document.getElementById('p_status');
  if(!naam){if(st)st.textContent='Vul eerst een naam in.';return;}
  if(st)st.textContent='De AI bedenkt 3 vragen…';
  var tok=getToken();
  fetch('/api/persona/vragen',{method:'POST',headers:{'Content-Type':'application/json','Authorization':tok?'Bearer '+tok:''},body:JSON.stringify({naam:naam})})
    .then(function(r){return r.json();})
    .then(function(j){
      if(j.error&&j.error.indexOf('DASHBOARD_TOKEN')!==-1){showLogin();return;}
      if(!j.ok){if(st)st.textContent='Fout: '+(j.error||'');return;}
      _wizardVragen=j.vragen;
      var html=j.vragen.map(function(v,i){
        return '<div class="lbl" style="margin-top:8px">'+(i+1)+'. '+esc(v)+'</div><input type="text" id="p_antwoord_'+i+'" style="width:100%">';
      }).join('')
      +'<div style="margin-top:10px"><button class="btn gold" data-persona-genereer>✨ Genereer persona</button></div>';
      document.getElementById('p_wizard_vragen').innerHTML=html;
      if(st)st.textContent='Beantwoord de vragen en klik Genereer persona.';
    })
    .catch(function(){if(st)st.textContent='Fout bij het ophalen van de vragen.';});
}
function personaGenereer(){
  var naam=document.getElementById('p_naam').value.trim();
  var st=document.getElementById('p_status');
  if(!naam||_wizardVragen.length<3){if(st)st.textContent='Doorloop eerst stap 1 (bedenk vragen).';return;}
  var antwoorden=_wizardVragen.map(function(v,i){var el=document.getElementById('p_antwoord_'+i);return el?el.value.trim():'';});
  if(!antwoorden.some(function(a){return a;})){if(st)st.textContent='Beantwoord minstens één vraag.';return;}
  if(st)st.textContent='De AI schrijft het profiel… (kan ~15 sec duren)';
  var tok=getToken();
  fetch('/api/persona/genereer',{method:'POST',headers:{'Content-Type':'application/json','Authorization':tok?'Bearer '+tok:''},body:JSON.stringify({naam:naam,vragen:_wizardVragen,antwoorden:antwoorden})})
    .then(function(r){return r.json();})
    .then(function(j){
      if(j.error&&j.error.indexOf('DASHBOARD_TOKEN')!==-1){showLogin();return;}
      if(!j.ok){if(st)st.textContent='Fout: '+(j.error||'');return;}
      document.getElementById('p_icoon').value=j.icoon||'';
      document.getElementById('p_trefwoord').value=j.trefwoord||'';
      document.getElementById('p_prompt').value=j.systemPrompt||'';
      updateIconPreview();
      document.getElementById('p_wizard_vragen').innerHTML='';
      _wizardVragen=[];
      if(st)st.textContent='Profiel gegenereerd ✓ — controleer, pas aan waar nodig en klik Opslaan.';
    })
    .catch(function(){if(st)st.textContent='Fout bij het genereren.';});
}

    +'<textarea id="i_v_out" rows="3" placeholder="(hier verschijnt de Kroket God-versie — je kunt nog bijschaven voor je verkondigt)" style="margin-top:6px"></textarea>'
    +'<div style="display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap"><span class="lbl" style="margin:0">🗓️ Inplannen op'+tip('Kies een datum/tijd in de toekomst om de verkondiging dan automatisch te plaatsen. Een 1-minuut-controle verstuurt geplande berichten op tijd. Ingeplande berichten verschijnen in de "Ingepland"-kaart en kun je daar overslaan.')+'</span>'
    +'<input type="datetime-local" id="i_v_tijd" style="width:auto;background:#16100a;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit">'
    +'<button class="btn" data-verkondig="plan">🗓️ Inplannen</button></div>'
    +'<div class="lbl" style="margin-top:16px;border-top:1px solid var(--line);padding-top:13px">🛒 Aflatenhandel — beheer'+tip('Geef of verwijder een power-up bij een lid zonder kroketpunten te rekenen. Met "aankondigen" plaatst de Frituurraad dezelfde plechtige melding in het hoofdkanaal als bij een echte aankoop; bij een vloek blijft de afzender ook dan verborgen voor het kanaal. Alles komt in de aankoophistorie en het audit-log.')+'</div>'
    +'<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><select id="w_lid" style="width:auto">'+wLeden+'</select>'
    +'<select id="w_item" style="width:auto">'+wItems+'</select>'
    +'<label class="tog" style="margin:0"><input type="checkbox" id="w_aankondig" checked> aankondigen</label>'
    +'<button class="btn gold" data-winkel="geef">🎁 Geef</button>'
    +'<button class="btn" data-winkel="verwijder">🗑️ Verwijder</button></div>'
    +'<div class="lbl" style="margin-top:16px;border-top:1px solid var(--line);padding-top:13px">🧪 Test-console'+tip('Stuur een prompt naar de Kroket God en zie zijn antwoord hier — er wordt NIETS in Slack geplaatst. Handig om de tone of voice, het decreet of een stemming te testen. Kost 1 LLM-call.')+'</div>'
    +'<textarea id="test_prompt" rows="2" placeholder="bv. wat vindt de Kroket God van bitterballen?"></textarea>'
    +'<div style="margin-top:6px"><button class="btn" data-test>🧪 Test</button></div>'
    +'<pre id="test_out" style="margin-top:8px;white-space:pre-wrap;background:#16100a;border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;color:var(--txt);min-height:20px"></pre>'
    +'</div>';
  var host=document.getElementById('instellingen');
  host.innerHTML=html;
  host.onclick=function(e){var b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-save'))bewaar();else if(b.hasAttribute('data-test'))testPrompt();else if(b.getAttribute('data-verkondig'))verkondig(b.getAttribute('data-verkondig'));else if(b.getAttribute('data-winkel'))winkelBeheer(b.getAttribute('data-winkel'));else if(b.getAttribute('data-actie'))doeActie(b.getAttribute('data-actie'));};
  host.oninput=function(e){if(e.target.id==='i_decreetInt'){var p=document.getElementById('i_decreetIntPct');if(p)p.textContent=e.target.value+'%';}};
}
function bewaar(){
  var uit=[];document.querySelectorAll('[data-prov]').forEach(function(c){if(c.checked)uit.push(c.getAttribute('data-prov'));});
  post('/api/instellingen',{stemmingOverride:document.getElementById('i_stemming').value,stilModus:document.getElementById('i_stil').checked,weekendRust:document.getElementById('i_weekend').checked,alleenTestkanaal:document.getElementById('i_test').checked,spaarstand:document.getElementById('i_spaar').checked,providerUit:uit,kortafKans:(+document.getElementById('i_kortaf').value||0)/100,warrigKans:(+document.getElementById('i_warrig').value||0)/100,vrijdagAppendKans:(+document.getElementById('i_vrijdag').value||0)/100,decreetVanDeDag:document.getElementById('i_decreet').value,decreetIntensiteit:(+document.getElementById('i_decreetInt').value||0)/100},'Opgeslagen');
}
function doeActie(a){post('/api/actie',{actie:a},'Uitgevoerd');}
function skip(soort,key,ts,id){post('/api/overslaan',{soort:soort,key:key?decodeURIComponent(key):'',ts:ts,id:id},'Overgeslagen');}
function verkondig(modus){
  var st=document.getElementById('i_status');
  if(modus==='vertaal'){
    var inp=document.getElementById('i_v_in').value.trim();
    if(!inp){if(st)st.textContent='Typ eerst een boodschap.';return;}
    if(st)st.textContent='Vertalen…';
    var tok=getToken();
    fetch('/api/verkondig',{method:'POST',headers:{'Content-Type':'application/json','Authorization':tok?'Bearer '+tok:''},body:JSON.stringify({tekst:inp,vertaal:true})}).then(function(r){return r.json();}).then(function(j){if(j.error&&j.error.indexOf('DASHBOARD_TOKEN')!==-1){showLogin();return;}if(j.ok){document.getElementById('i_v_out').value=j.verkondiging;if(st)st.textContent='Vertaald ✓ — controleer en klik Verkondig nu of Inplannen';}else if(st)st.textContent='Fout: '+(j.error||'');}).catch(function(){if(st)st.textContent='Fout';});
  }else{
    var out=document.getElementById('i_v_out').value.trim();
    if(!out){if(st)st.textContent='Klik eerst Vertaal (of typ zelf de Kroket God-tekst in het onderste veld).';return;}
    var kanaal=document.getElementById('i_v_kanaal').value;
    if(modus==='plan'){
      var tv=document.getElementById('i_v_tijd').value;
      if(!tv){if(st)st.textContent='Kies eerst een datum/tijd om in te plannen.';return;}
      var ms=new Date(tv).getTime();
      if(!ms||ms<Date.now()){if(st)st.textContent='Kies een tijdstip in de toekomst.';return;}
      post('/api/verkondig',{tekst:out,kanaal:kanaal,vertaal:false,wanneer:ms},'Ingepland');
    }else{
      post('/api/verkondig',{tekst:out,kanaal:kanaal,vertaal:false},'Verkondigd');
    }
  }
}
function getToken(){return localStorage.getItem('dashboard_token')||'';}
function scoreDelta(uid,delta){post('/api/score',{userId:uid,delta:delta},'Score aangepast');setTimeout(tick,800);}
function banActie(uid,actie){post('/api/ban',{userId:uid,actie:actie,uren:4},actie==='opheffen'?'Ban opgeheven':'Ban verlengd');setTimeout(tick,800);}
function winkelBeheer(actie){post('/api/winkel',{actie:actie,userId:document.getElementById('w_lid').value,item:document.getElementById('w_item').value,aankondig:document.getElementById('w_aankondig').checked},actie==='geef'?'Gegeven':'Verwijderd');setTimeout(tick,800);}
function winkelVerwijder(uid,item){post('/api/winkel',{actie:'verwijder',userId:uid,item:item},'Verwijderd');setTimeout(tick,800);}
function testPrompt(){
  var inp=document.getElementById('test_prompt');var out=document.getElementById('test_out');
  if(!inp||!inp.value.trim())return;
  out.textContent='De Kroket God overdenkt…';
  var tok=getToken();
  fetch('/api/test',{method:'POST',headers:{'Content-Type':'application/json','Authorization':tok?'Bearer '+tok:''},body:JSON.stringify({prompt:inp.value.trim()})})
    .then(function(r){return r.json();})
    .then(function(j){if(j.error&&j.error.indexOf('DASHBOARD_TOKEN')!==-1){showLogin();out.textContent='';return;}out.textContent=j.ok?j.antwoord:('Fout: '+(j.error||''));})
    .catch(function(){out.textContent='Fout bij aanroep';});
}
function post(url,body,okmsg,statusId){var st=document.getElementById(statusId||'i_status');if(st)st.textContent='…';var tok=getToken();fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':tok?'Bearer '+tok:''},body:JSON.stringify(body)}).then(function(r){return r.json();}).then(function(j){if(j.error&&j.error.indexOf('DASHBOARD_TOKEN')!==-1){showLogin();return;}if(st)st.textContent=(j.ok?((j.bericht||okmsg)+' ✓'):('Fout: '+(j.error||'')));}).catch(function(){if(st)st.textContent='Fout';});}
function showLogin(){var el=document.getElementById('login_overlay');if(el)el.style.display='flex';}
function saveToken(){var t=document.getElementById('login_token').value.trim();if(t){localStorage.setItem('dashboard_token',t);document.getElementById('login_overlay').style.display='none';}}
function tick(){var tok=getToken();fetch('/api/stats',{headers:tok?{'Authorization':'Bearer '+tok}:{}}).then(function(r){if(r.status===401){showLogin();document.getElementById('status').textContent='toegangscode vereist';document.getElementById('status').className='pill off';return null;}return r.json();}).then(function(d){if(!d)return;render(d);if(!ingesteld){renderInstellingen(d);ingesteld=true;}if(!personasIngesteld){renderPersonaForm();personasIngesteld=true;}renderPersonaLijst(d);}).catch(function(){document.getElementById('status').textContent='offline';document.getElementById('status').className='pill off';});}
// ── Tab-navigatie (2.0): actieve tab onthouden in localStorage ────────────────
function switchTab(t){
  document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('act',b.getAttribute('data-tab')===t);});
  document.querySelectorAll('.tabpane').forEach(function(p){p.classList.toggle('act',p.id==='tab-'+t);});
  try{localStorage.setItem('dash_tab',t);}catch(_){}
}
document.getElementById('tabs').onclick=function(e){var b=e.target.closest('.tab');if(b)switchTab(b.getAttribute('data-tab'));};
switchTab((function(){try{return localStorage.getItem('dash_tab');}catch(_){return null;}})()||'overzicht');
// Logs-zoekfilter: verbergt niet-matchende regels in alle feeds op het Logs-tabblad
function filterLogs(){
  var q=(document.getElementById('logzoek').value||'').toLowerCase();
  document.querySelectorAll('#c_logs .feed .row').forEach(function(r){
    r.style.display=r.textContent.toLowerCase().indexOf(q)>=0?'':'none';
  });
}
tick();setInterval(tick,15000);
</script></body></html>
