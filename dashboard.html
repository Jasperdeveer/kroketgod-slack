<!doctype html>
<html lang="nl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kroket God Dashboard</title>
<style>
:root{
  color-scheme:dark;
  --bg:#120c06;--card:#221809;--card2:#2a1e0c;--gold:#f0c060;--gold2:#caa047;--amber:#e08a2a;
  --txt:#f6ead0;--dim:#b89c72;--muted:#9a835e;--green:#7fd07f;--red:#e07a5a;--line:#4a3618;--grid:#36280f;
  /* reeksen: dataviz-palet (dark), gevalideerd op --card: CVD dE 8.4, normaal 19.3, contrast >= 3:1 */
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c;
  --pos:#3987e5;--neg:#e66767;--warn:#fab219;--crit:#d03b3b;
  --r:16px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;display:grid;grid-template-columns:236px minmax(0,1fr);color:var(--txt);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(1000px 520px at 75% -12%,rgba(224,138,42,.15),transparent 60%),var(--bg);background-attachment:fixed}
button,select,input,textarea{font:inherit;color:inherit}
a{color:inherit}

/* ---------- zijbalk ---------- */
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:3px;padding:20px 12px;
  background:linear-gradient(180deg,#1b1209,#130c06);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding:2px 8px 22px}
.logo{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#2a1a06;
  background:radial-gradient(circle at 35% 30%,#ffe6a8,var(--gold) 42%,var(--amber));
  box-shadow:0 0 0 4px rgba(240,192,96,.12),0 0 26px rgba(240,192,96,.35)}
.wm{white-space:nowrap;font-family:Georgia,"Times New Roman",serif;font-weight:700;letter-spacing:1.5px;color:var(--gold);font-size:16px;line-height:1.15}
.wm small{display:block;font-family:system-ui,sans-serif;letter-spacing:.3px;color:var(--dim);font-size:11px;font-weight:500}
.nav{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:12px;color:var(--dim);text-decoration:none;font-weight:560;border:1px solid transparent;transition:background .15s,color .15s}
.nav .ic{font-size:18px;width:24px;text-align:center}
.nav:hover{background:rgba(240,192,96,.06);color:var(--txt)}
.nav[aria-current=page]{background:linear-gradient(90deg,rgba(240,192,96,.17),rgba(240,192,96,.03));color:var(--gold);border-color:rgba(240,192,96,.25)}
.badge{margin-left:auto;font-size:11px;padding:1px 8px;border-radius:99px;background:#3a2a12;color:var(--txt);font-weight:600}
.badge.hot{background:rgba(224,122,90,.18);color:var(--red)}
.side .foot{margin-top:auto;font-size:11px;color:var(--muted);padding:10px 12px 0;border-top:1px solid var(--line)}

/* ---------- topbalk ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:14px 28px;
  background:rgba(18,12,6,.84);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:20px;font-weight:700;display:flex;gap:10px;align-items:baseline;white-space:nowrap}
.top h1 small{font-size:13px;font-weight:500;color:var(--dim)}
.pills{display:flex;gap:8px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font-size:12px;font-weight:600;background:var(--card2);border:1px solid var(--line)}
.pill.on{border-color:rgba(127,208,127,.45)}
.pill .d{width:8px;height:8px;border-radius:50%;background:var(--green);animation:ping 2.2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(127,208,127,.55)}70%,100%{box-shadow:0 0 0 7px rgba(127,208,127,0)}}
.pill .rf{display:inline-block}
.refreshing .pill .rf{animation:spin .7s linear}
@keyframes spin{to{transform:rotate(360deg)}}
.num{font-variant-numeric:tabular-nums}

/* ---------- inhoud ---------- */
.content{padding:24px 28px 56px;max-width:1340px}
.sec{display:none}
.sec.on{display:block;animation:secIn .28s ease-out}
@keyframes secIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.refreshing .chart{opacity:.55}
.chart{transition:opacity .25s}
.st{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:var(--gold);margin:30px 0 12px;font-weight:700;display:flex;align-items:center;gap:8px}
.st:first-child{margin-top:0}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:14px;margin-bottom:22px}
.kpi,.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);
  box-shadow:inset 0 1px 0 rgba(240,192,96,.07),0 10px 28px rgba(0,0,0,.32);min-width:0}
.kpi{padding:15px 17px 14px;display:flex;flex-direction:column}
.kpi .l{font-size:12px;color:var(--dim);font-weight:560}
.kpi .v{font-size:30px;font-weight:700;letter-spacing:-.5px;line-height:1.2;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v small{font-size:15px;color:var(--dim);font-weight:600;letter-spacing:0}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi .dl{font-size:12px;font-weight:600;margin-top:2px}
.good{color:var(--green)}.bad{color:var(--red)}
.meter{height:6px;border-radius:99px;background:rgba(240,192,96,.16);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;border-radius:99px;background:var(--gold)}
.meter.warn{background:rgba(224,138,42,.18)}.meter.warn i{background:var(--amber)}
.meter.full{background:rgba(224,122,90,.18)}.meter.full i{background:var(--red)}
.sp{position:relative;height:26px;margin-top:10px}
.sp svg{display:block;width:100%;height:100%;overflow:visible}
.sp i{position:absolute;right:-3px;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px var(--card)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:16px;margin-bottom:16px}
.span2{grid-column:1/-1}
.card{padding:16px 18px 14px}
.ch{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.ch h3{margin:0;font-size:15px;font-weight:650}
.ch p{margin:2px 0 0;font-size:12px;color:var(--dim)}
.tbtn{flex:none;background:none;border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:11px;color:var(--dim);cursor:pointer}
.tbtn:hover,.tbtn[aria-pressed=true]{border-color:var(--gold);color:var(--gold)}

/* grafiek-onderdelen */
.chart svg{display:block;overflow:visible}
.tk{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.lab{fill:var(--dim);font-size:12px}
.val{fill:var(--txt);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.halo{paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
.gl{stroke:var(--grid);stroke-width:1}
.bl{stroke:var(--line);stroke-width:1}
.ref{stroke:var(--dim);stroke-width:1;stroke-dasharray:4 3}
.nowl{stroke:var(--gold);stroke-width:1}
.ring{stroke:var(--card);stroke-width:2}
.hit{fill:transparent;cursor:crosshair}
.band.wash.hot .hit{fill:rgba(240,192,96,.08)}
.xh{stroke:var(--dim);stroke-width:1;opacity:0}
.hd{opacity:0}
.band.hot .xh,.band.hot .hd{opacity:1}
.cell{cursor:crosshair}
.cell.hot{stroke:var(--txt);stroke-width:1.5}
.pt.hot .mk{stroke:var(--txt)}
.pulse{fill:none;stroke:var(--gold);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.9}to{transform:scale(3);opacity:0}}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:-2px 0 10px;font-size:12px;color:var(--dim)}
.legend span{white-space:nowrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.ln{width:14px;height:3px;border-radius:2px;vertical-align:3px}
.scale{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);margin-top:8px}
.scale i{width:120px;height:8px;border-radius:99px;background:linear-gradient(90deg,rgb(53,39,16),#f0c060)}
.pair{display:grid;gap:8px 24px}
.pair.two{grid-template-columns:1fr 1fr}
.pair h4{margin:0 0 4px;font-size:12px;color:var(--dim);font-weight:600}
table.dt{width:100%;border-collapse:collapse;font-size:12px}
.dt th,.dt td{padding:5px 8px;border-bottom:1px solid rgba(74,54,24,.6);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dt th{color:var(--dim);font-weight:600}
.dt td:last-child{white-space:normal}
.dt th:first-child,.dt td:first-child{text-align:left}
.dtw{overflow-x:auto;max-height:340px}

/* tooltip */
#tip{position:fixed;z-index:60;left:0;top:0;pointer-events:none;min-width:140px;max-width:260px;background:#0e0904;border:1px solid var(--line);border-radius:10px;
  padding:8px 11px;box-shadow:0 12px 30px rgba(0,0,0,.6);font-size:12px;opacity:0;transition:opacity .1s}
#tip.on{opacity:1}
#tip .tt{color:var(--dim);margin-bottom:3px}
#tip .tr{display:flex;align-items:center;gap:8px;line-height:1.75}
#tip .tr i{width:12px;height:3px;border-radius:2px;flex:none}
#tip .tr b{font-variant-numeric:tabular-nums;color:var(--txt)}
#tip .tr span{color:var(--dim)}

/* bediening */
.panel{border:1px solid var(--line);border-radius:var(--r);background:rgba(34,24,9,.55);margin-bottom:10px;overflow:hidden}
.panel summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 18px;font-weight:650}
.panel summary::-webkit-details-marker{display:none}
.panel summary:hover{background:rgba(240,192,96,.04)}
.panel .pk{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--gold)}
.panel .ph{color:var(--muted);font-weight:500;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.panel summary>span:nth-child(2){white-space:nowrap}
.panel .chev{margin-left:auto;transition:transform .2s;color:var(--gold)}
.panel[open] .chev{transform:rotate(90deg)}
.panel .pb{padding:14px 18px 18px;border-top:1px solid var(--line)}
.btn{background:#2c2010;border:1px solid var(--line);border-radius:10px;padding:7px 13px;cursor:pointer;font-weight:560}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#1a1208;border-color:var(--gold);font-weight:700}
.btn.sm{padding:3px 10px;font-size:12px;border-radius:8px}
.btn.dng{color:var(--red)}
.seg{display:inline-flex;background:#16100a;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{background:none;border:0;border-radius:8px;padding:5px 12px;color:var(--dim);cursor:pointer;font-weight:600}
.seg button.on{background:var(--gold);color:#1a1208}
input,select,textarea{background:#16100a;border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-width:0}
textarea{width:100%;min-height:80px;resize:vertical}
input[type=number]{width:72px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--dim)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;font-size:13px;color:var(--txt);border-bottom:1px solid rgba(74,54,24,.5);cursor:pointer}
.sw input{appearance:none;-webkit-appearance:none;flex:none;width:36px;height:20px;border-radius:99px;background:#3a2a12;border:0;padding:0;position:relative;cursor:pointer;transition:background .15s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--dim);transition:transform .15s,background .15s}
.sw input:checked{background:var(--amber)}
.sw input:checked::after{transform:translateX(16px);background:#1a1208}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(74,54,24,.5);font-size:13px;flex-wrap:wrap}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:120px}
.li small{color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.h4{font-size:12px;color:var(--dim);font-weight:650;margin:16px 0 6px;text-transform:uppercase;letter-spacing:.8px}
.h4:first-child{margin-top:0}

/* live */
.live{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.lgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.mh{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.mh .em{flex:none;font-size:20px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(240,192,96,.08);border:1px solid rgba(240,192,96,.18)}
.mh h3{margin:0;font-size:15px}.mh p{margin:0;font-size:12px;color:var(--dim)}
.mh .badge{align-self:flex-start}
.chip{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#1a1208;border:1px solid var(--line);margin-top:8px}
.chip .em{font-size:18px}
.chip .grow{flex:1;min-width:0}
.chip b{font-size:13px}.chip small{display:block;font-size:12px;color:var(--dim)}
.prog{height:4px;border-radius:99px;background:rgba(240,192,96,.15);margin-top:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width 1s linear}
.prog.fuse{height:6px;background:rgba(224,122,90,.15)}
.prog.fuse i{background:linear-gradient(90deg,var(--red),var(--amber) 85%,#ffe6a8)}
.vote{display:grid;grid-template-columns:86px 1fr 22px;gap:10px;align-items:center;font-size:12px;margin-top:8px;color:var(--dim)}
.vote .t{height:8px;border-radius:99px;background:rgba(240,192,96,.1);overflow:hidden}
.vote .t i{display:block;height:100%;border-radius:99px}
.vote b{color:var(--txt);text-align:right;font-variant-numeric:tabular-nums}
.hp{height:12px;border-radius:99px;background:rgba(217,89,38,.2);overflow:hidden}
.hp i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--s2),var(--amber))}
.pips{display:inline-flex;gap:4px;vertical-align:middle}
.pips i{width:20px;height:8px;border-radius:99px;background:rgba(240,192,96,.16)}
.pips i.f{background:var(--gold)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px solid rgba(74,54,24,.5)}
.kv span{color:var(--dim)}
.tl{position:sticky;top:88px}
.tl ol{list-style:none;margin:0;padding:0;position:relative}
.tl ol::before{content:"";position:absolute;left:66px;top:10px;bottom:10px;width:2px;background:var(--line)}
.tl li{display:grid;grid-template-columns:44px 30px minmax(0,1fr) auto;gap:8px;align-items:start;padding:6px 0}
.tl time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:6px;text-align:right}
.tl .ico{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--card2);border:1px solid var(--line);font-size:14px;position:relative;z-index:1}
.tl li.now .ico{border-color:var(--gold);box-shadow:0 0 0 3px rgba(240,192,96,.15)}
.tl .tx{font-size:13px;padding-top:5px}
.pts{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pts.p{color:var(--green);background:rgba(127,208,127,.1)}
.pts.m{color:var(--red);background:rgba(224,122,90,.12)}
.livedot{width:8px;height:8px;border-radius:50%;background:var(--red);animation:ping2 1.6s infinite}
@keyframes ping2{0%{box-shadow:0 0 0 0 rgba(224,122,90,.6)}70%,100%{box-shadow:0 0 0 7px rgba(224,122,90,0)}}

/* toast */
#toast{position:fixed;left:50%;bottom:28px;width:max-content;max-width:calc(100vw - 32px);z-index:70;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:#0e0904;border:1px solid var(--gold);color:var(--txt);border-radius:12px;padding:10px 16px;font-size:13px;box-shadow:0 12px 30px rgba(0,0,0,.6);transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* tabbalk (telefoon) */
.tabbar{display:none}
@media (max-width:1100px){.live{grid-template-columns:minmax(0,1fr)}.tl{position:static}}
@media (max-width:767px){
  body{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .top{flex-wrap:wrap;padding:10px 16px 8px;gap:8px}
  .top h1{font-size:18px}
  .top h1 small{display:none}
  .pills{margin:0 -16px;padding:0 16px 2px;width:calc(100% + 32px)}
  .content{padding:16px 16px calc(88px + env(safe-area-inset-bottom))}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:16px}
  .kpi{padding:12px 13px}
  .kpi .v{font-size:23px}
  .card{padding:14px 14px 12px}
  .grid{gap:12px;margin-bottom:12px}
  .panel summary{padding:13px 14px}.panel .pb{padding:12px 14px 16px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(20,13,6,.95);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0 4px;font-size:10px;font-weight:600;color:var(--dim);text-decoration:none;border-radius:10px}
  .tab .ic{font-size:19px;line-height:1}
  .tab[aria-current=page]{color:var(--gold);background:rgba(240,192,96,.1)}
  #toast{bottom:calc(84px + env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- dashboard (bovenop het ontwerp) ---------- */
.chart{overflow:hidden}
.side .foot{overflow-wrap:anywhere}
.leeg{padding:34px 8px;text-align:center;color:var(--muted);font-size:13px}
.muted{color:var(--dim)}
.hint{margin:0 0 10px;font-size:12px;color:var(--dim)}
.dc{display:contents}
.live{margin-bottom:16px}
.dot.ok{background:var(--green)}.dot.cool{background:var(--gold)}.dot.off{background:#5a4a30}
.pill.off{border-color:rgba(224,122,90,.5);color:var(--red)}.pill.off .d{background:var(--red);animation:none}
.lbl{font-size:12px;color:var(--dim);font-weight:600;margin:12px 0 5px}
.numl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;font-size:13px;color:var(--txt);border-bottom:1px solid rgba(74,54,24,.5)}
.tog{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}.tog input{accent-color:var(--amber)}
.feed{max-height:300px;overflow:auto}
.feed .row{display:block;padding:5px 0;border-bottom:1px solid rgba(74,54,24,.5);font-size:12px}.feed .row:last-child{border:0}
.feed .t{color:var(--muted);font-size:11px}
.li,.feed .row,.kv,.chip{overflow-wrap:anywhere}
.zoek{width:100%;margin-bottom:10px}
select,input[type=text],input[type=file],input[type=datetime-local]{max-width:100%}
pre.uit{white-space:pre-wrap;background:#16100a;border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;min-height:20px;margin:8px 0 0}
.info{display:inline-block;width:15px;height:15px;line-height:14px;text-align:center;border-radius:50%;border:1px solid var(--gold2);color:var(--gold);font-size:10px;font-weight:700;font-style:italic;cursor:help;margin-left:5px;position:relative;vertical-align:middle;text-transform:none;letter-spacing:0}
.info:hover{background:var(--gold2);color:#1a1208}
.info:hover::after{content:attr(data-tip);position:absolute;left:50%;bottom:150%;transform:translateX(-50%);width:240px;max-width:70vw;background:#16100a;color:var(--txt);border:1px solid var(--gold2);border-radius:8px;padding:8px 11px;font-size:12px;font-weight:400;font-style:normal;line-height:1.45;text-align:left;box-shadow:0 8px 22px rgba(0,0,0,.55);z-index:20;white-space:normal}
@media (max-width:767px){.info:hover::after{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));width:auto;max-width:none;transform:none;z-index:65}} /* telefoon: uitleg boven de tabbalk, nooit buiten beeld */
#login_overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999;align-items:center;justify-content:center}
#login_box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;width:min(340px,calc(100vw - 32px));display:flex;flex-direction:column;gap:12px}
#login_box h2{margin:0;color:var(--gold);font-size:16px}
</style>
</head>
<body>
<div id="login_overlay"><div id="login_box"><h2>⚜️ Toegangscode vereist</h2><input id="login_token" type="password" placeholder="DASHBOARD_TOKEN" onkeydown="if(event.key==='Enter')saveToken()"><button class="btn gold" onclick="saveToken()">Bevestigen</button></div></div>
<nav class="side" aria-label="Secties">
  <div class="brand"><div class="logo">KG</div><div class="wm">KROKET GOD<small>eigenaarsdashboard</small></div></div>
  <div id="sidenav"></div>
  <div class="foot"><span id="i_status"></span> <span id="i_actiestatus"></span><br>Ververst elke 15 s</div>
</nav>
<div style="min-width:0">
  <header class="top">
    <h1 id="title"></h1>
    <div class="pills">
      <span class="pill" id="status"><span class="d"></span><span id="status_t">…</span></span>
      <span class="pill">⏱ <span class="num" id="uptime"></span></span>
      <span class="pill" id="mood"></span>
      <span class="pill">🍟 <span id="vrijdag"></span></span>
      <span class="pill" title="Ververst elke 15 seconden"><span class="rf">↻</span> <span class="num" id="fresh">…</span></span>
    </div>
  </header>
  <main class="content" id="main"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Secties"></nav>
<div id="tip" role="tooltip"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script id="kern">
'use strict';
// ── Kern: puur, zonder DOM. Helpers, grafieken, tegels, lijsten, formulieren en het skelet van de secties.
// scripts/rooktest/dashboard-grafieken.js draait dit blok in node op echte bouwDashboardData()-uitvoer.
const MND=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'],DAGN=['zo','ma','di','wo','do','vr','za'];
// shortcut: dezelfde getallen als NIVEAUS (perDag) en PLAFOND in lib/regie.js; zet ze in /api/stats als ze gaan schuiven.
const NIV={uit:0,laag:2,normaal:4,wild:7},MAX_GEVEN=15,MAX_NEMEN=10;
const LEEG='<div class="leeg">nog geen data — vult zich vanaf vandaag</div>';

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const fmtN=v=>v==null||!isFinite(v)?'–':(v<0?'−':'')+Math.abs(Math.round(v)).toLocaleString('nl-NL');
const fmtS=v=>(v>0?'+':'')+fmtN(v);
const fmt1=v=>v==null?'–':(Math.round(v*10)/10).toLocaleString('nl-NL');
const sum=a=>a.reduce((x,y)=>x+(+y||0),0);
const dagD=k=>new Date(k+'T12:00:00Z');
const dl=k=>{const d=dagD(k);return d.getUTCDate()+' '+MND[d.getUTCMonth()]};
const wd=k=>DAGN[dagD(k).getUTCDay()];
const dlw=k=>wd(k)+' '+dl(k);
const uur=ts=>new Date(ts).toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});
const datum=ts=>new Date(ts).toLocaleString('nl-NL',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
function dur(s){s=Math.max(0,s|0);const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return d>0?d+'d '+h+'u':h>0?h+'u '+m+'m':m>0?m+'m':s+'s'}
// Uren sinds maandag 00:00 Amsterdamse tijd (de week-as van de verrassingen).
function weekUur(ts,maandag){
  const p={};new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Amsterdam',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(ts).forEach(x=>p[x.type]=x.value);
  return (Date.parse(`${p.year}-${p.month}-${p.day}`)-Date.parse(maandag))/36e5+(+p.hour)+(+p.minute)/60;
}
function kleurVan(d){const m={};(((d.stats||{}).ranglijst)||[]).forEach((r,i)=>m[r.naam]=`var(--s${i%6+1})`);return(n,i)=>m[n]||`var(--s${(i||0)%6+1})`}

// ── grafiek-onderdelen (uit de goedgekeurde mockup) ──
function scale(lo,hi,n=4){
  const span=(hi-lo)||1,raw=span/n,p=10**Math.floor(Math.log10(raw)),step=[1,2,5,10].map(m=>m*p).find(s=>s>=raw-1e-9);
  const a=Math.floor(lo/step+1e-9)*step;let b=Math.ceil(hi/step-1e-9)*step;if(b<=a)b=a+step;
  const list=[];for(let v=a;v<=b+1e-9;v+=step)list.push(Math.round(v*1e6)/1e6);return{lo:a,hi:b,list};
}
function frame(s,w,lo,hi,R=14){
  const H=s.h||220,T=14,B=28,tk=scale(lo,hi),f=s.fmt||fmtN;
  const L=Math.round(Math.max(...tk.list.map(v=>f(v).length))*6.6+14),pw=w-L-R,ph=H-T-B;
  const y=v=>T+ph*(tk.hi-v)/(tk.hi-tk.lo);let g='';
  tk.list.forEach(v=>{const yy=y(v);g+=`<line class="${v===0?'bl':'gl'}" x1="${L}" x2="${w-R}" y1="${yy}" y2="${yy}"/><text class="tk" x="${L-8}" y="${yy+4}" text-anchor="end">${f(v)}</text>`});
  return{H,T,B,L,R,pw,ph,y,g,f};
}
function xl(labels,xs,y,pw){
  const ch=Math.max(...labels.map(l=>l.length)),every=Math.max(1,Math.ceil(labels.length*(ch*6.4+10)/pw)),n=labels.length;
  return labels.map((l,i)=>(n-1-i)%every===0?`<text class="tk" x="${xs[i]}" y="${y}" text-anchor="middle">${esc(l)}</text>`:'').join('');
}
function vb(x,y,w,h,round,c){if(h<=0)return'';const r=round?Math.min(4,h,w/2):0;
  return`<path d="M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z" style="fill:${c}"/>`}
function hb(x,y,w,h,dir,c){if(w<=0)return'';const r=dir?Math.min(4,w,h/2):0;
  return dir>=0?`<path d="M${x},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h-r}Q${x+w},${y+h} ${x+w-r},${y+h}H${x}Z" style="fill:${c}"/>`
              :`<path d="M${x+w},${y}H${x+r}Q${x},${y} ${x},${y+r}V${y+h-r}Q${x},${y+h} ${x+r},${y+h}H${x+w}Z" style="fill:${c}"/>`}
const legend=(items,kind)=>`<div class="legend">${items.map(it=>`<span><i class="${kind==='line'?'ln':''}" style="background:${it.color}"></i>${esc(it.name)}</span>`).join('')}</div>`;
const svg=(w,h,inner)=>`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${inner}</svg>`;
function weekAxis(L,w,R,T,bottom,now){
  const pw=w-L-R,X=h=>L+pw*h/168;let g='';
  for(let d=0;d<=7;d++)g+=`<line class="gl" x1="${X(d*24)}" x2="${X(d*24)}" y1="${T}" y2="${bottom}"/>`;
  ['ma','di','wo','do','vr','za','zo'].forEach((n,d)=>g+=`<text class="tk" x="${X(d*24+12)}" y="${bottom+18}" text-anchor="middle">${n}</text>`);
  g+=`<line class="nowl" x1="${X(now)}" x2="${X(now)}" y1="${T-2}" y2="${bottom}"/><text class="tk" x="${X(now)}" y="${T-6}" text-anchor="middle" style="fill:var(--gold)">nu</text>`;
  return{X,g};
}

// ── renderers: (spec, breedte) -> {html, tip(i)} ──
const R={
  cols(s,w){
    const n=s.labels.length,tot=i=>sum(s.series.map(se=>se.values[i]));
    const mx=Math.max(...s.labels.map((_,i)=>s.stacked?tot(i):Math.max(...s.series.map(se=>se.values[i]||0))),...(s.refs||[]).map(r=>r.v));
    const F=frame(s,w,0,mx),bw=F.pw/n,k=s.stacked?1:s.series.length;
    const barW=s.stacked?Math.min(24,bw*.62):Math.max(1,Math.min(24,(bw*.78-2*(k-1))/k));
    let m='',b='';const xs=[];
    s.labels.forEach((_,i)=>{const cx=F.L+bw*i+bw/2;xs.push(cx);
      if(s.stacked){let a=0;const vis=s.series.filter(se=>se.values[i]>0);
        vis.forEach((se,j)=>{const v=se.values[i],y0=F.y(a),y1=F.y(a+v);a+=v;m+=vb(cx-barW/2,y1,barW,(y0-y1)-(j>0?2:0),j===vis.length-1,se.color)})}
      else s.series.forEach((se,j)=>{const v=se.values[i]||0,x=cx-(k*barW+2*(k-1))/2+j*(barW+2);m+=vb(x,F.y(v),barW,F.y(0)-F.y(v),true,se.color)});
      b+=`<g class="band wash" data-i="${i}"><rect class="hit" x="${F.L+bw*i}" y="${F.T}" width="${bw}" height="${F.ph}"/></g>`});
    (s.refs||[]).forEach(r=>{const y=F.y(r.v);m+=`<line class="ref" x1="${F.L}" x2="${w-F.R}" y1="${y}" y2="${y}"/><text class="tk halo" x="${w-F.R}" y="${y-5}" text-anchor="end">${esc(r.label)}</text>`});
    return{html:(s.series.length>1?legend(s.series):'')+svg(w,F.H,F.g+m+xl(s.labels,xs,F.T+F.ph+18,F.pw)+b),
      tip:i=>({title:(s.tips||s.labels)[i],rows:s.series.map(se=>({c:se.color,v:F.f(se.values[i]||0),l:se.name})).reverse()
        .concat(s.stacked&&s.series.length>1?[{v:F.f(tot(i)),l:'totaal'}]:[]).concat((s.refs||[]).map(r=>({v:F.f(r.v),l:r.label})))})};
  },
  line(s,w){
    const vals=s.series.flatMap(x=>x.values).filter(v=>v!=null);
    const F=frame(s,w,Math.min(0,...vals),Math.max(...vals,...(s.refs||[]).map(r=>r.v)),s.endLabel==='value'?46:14);
    const n=s.labels.length,X=i=>F.L+F.pw*i/(n-1);let m='',b='';const ends=[];
    (s.refs||[]).forEach(r=>{const y=F.y(r.v);m+=`<line class="ref" x1="${F.L}" x2="${w-F.R}" y1="${y}" y2="${y}"/><text class="tk halo" x="${F.L+6}" y="${y-5}">${esc(r.label)}</text>`});
    s.series.forEach(se=>{let d='',on=false,first=-1,last=-1;
      se.values.forEach((v,i)=>{if(v==null){on=false;return}const x=X(i),y=F.y(v);d+=on?(s.step?`H${x}V${y}`:`L${x},${y}`):`M${x},${y}`;on=true;if(first<0)first=i;last=i});
      if(s.area&&first>=0)m+=`<path d="${d}V${F.y(0)}H${X(first)}Z" style="fill:${se.color};fill-opacity:.12"/>`;
      m+=`<path d="${d}" fill="none" style="stroke:${se.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      if(last>=0){const y=F.y(se.values[last]);m+=`<circle class="ring" cx="${X(last)}" cy="${y}" r="4" style="fill:${se.color}"/>`;ends.push({se,x:X(last),y,v:se.values[last]})}});
    if(s.endLabel){ends.sort((a,b)=>a.y-b.y);let prev=-99;
      ends.forEach(e=>{if(e.y-prev<15)return;prev=e.y;const t=s.endLabel==='name'?e.se.name+' '+F.f(e.v):F.f(e.v),rechts=e.x+9+t.length*6.6<=w;
        m+=`<text class="val halo" x="${rechts?e.x+9:e.x-9}" y="${e.y+4}" text-anchor="${rechts?'start':'end'}">${esc(t)}</text>`})}
    const bw=F.pw/(n-1);
    for(let i=0;i<n;i++){const x=X(i),x0=Math.max(F.L,x-bw/2),x1=Math.min(F.L+F.pw,x+bw/2);
      b+=`<g class="band" data-i="${i}"><rect class="hit" x="${x0}" y="${F.T}" width="${x1-x0}" height="${F.ph}"/><line class="xh" x1="${x}" x2="${x}" y1="${F.T}" y2="${F.T+F.ph}"/>`+
        s.series.map(se=>se.values[i]==null?'':`<circle class="hd ring" cx="${x}" cy="${F.y(se.values[i])}" r="4" style="fill:${se.color}"/>`).join('')+'</g>'}
    return{html:(s.series.length>1?legend(s.series,'line'):'')+svg(w,F.H,F.g+m+xl(s.labels,s.labels.map((_,i)=>X(i)),F.T+F.ph+18,F.pw)+b),
      tip:i=>({title:(s.tips||s.labels)[i],rows:s.series.filter(se=>se.values[i]!=null).sort((a,b)=>b.values[i]-a.values[i])
        .map(se=>({c:se.color,v:F.f(se.values[i]),l:se.name}))})};
  },
  hbars(s,w){
    const rows=s.rows,rh=s.rh||32,bh=Math.min(16,rh-14),ser=s.series||[{name:s.valName,color:s.color}],f=s.fmt||fmtN;
    const labW=Math.min(Math.round(w*.4),Math.max(...rows.map(r=>r.label.length))*7+16),H=rows.length*rh;let m='',b='';
    rows.forEach((r,i)=>{const ty=i*rh+rh/2+4;
      m+=`<text class="lab" x="${labW-10}" y="${ty}" text-anchor="end">${esc(r.label)}</text>`;
      b+=`<g class="band wash" data-i="${i}"><rect class="hit" x="0" y="${i*rh}" width="${w}" height="${rh}"/></g>`});
    if(s.diverging){
      const M=Math.max(1,...rows.map(r=>Math.abs(r.values[0]))),pad=42,c=labW+(w-labW)/2,half=(w-labW)/2-pad;
      m+=`<line class="bl" x1="${c}" x2="${c}" y1="0" y2="${H}"/>`;
      rows.forEach((r,i)=>{const v=r.values[0],len=half*Math.abs(v)/M,y=i*rh+(rh-bh)/2,ty=i*rh+rh/2+4;
        if(v>=0)m+=hb(c,y,len,bh,1,'var(--pos)')+`<text class="val" x="${c+len+6}" y="${ty}">${fmtS(v)}</text>`;
        else m+=hb(c-len,y,len,bh,-1,'var(--neg)')+`<text class="val" x="${c-len-6}" y="${ty}" text-anchor="end">${fmtS(v)}</text>`});
    }else{
      const tot=r=>sum(r.values),M=Math.max(1,...rows.map(tot)),sc=(w-labW-52)/M;
      rows.forEach((r,i)=>{const y=i*rh+(rh-bh)/2;let x=labW;const vis=r.values.map((v,j)=>[v,j]).filter(a=>a[0]>0);
        vis.forEach(([v,j],q)=>{const len=v*sc;m+=hb(x,y,len-(q<vis.length-1?2:0),bh,q===vis.length-1?1:0,r.color||ser[j].color);x+=len});
        m+=`<text class="val" x="${labW+Math.max(0,tot(r))*sc+6}" y="${i*rh+rh/2+4}">${f(tot(r))}</text>`});
    }
    const leg=s.legend?legend(s.legend):ser.length>1?legend(ser):'';
    return{html:leg+svg(w,H,m+b),tip:i=>{const r=rows[i];return{title:r.label,
      rows:ser.map((se,j)=>({c:r.color||se.color||(r.values[j]>=0?'var(--pos)':'var(--neg)'),v:s.diverging?fmtS(r.values[j]):f(r.values[j]),l:se.name})).concat(r.extra||[])}}};
  },
  heat(s,w){
    const labW=Math.min(Math.round(w*.3),Math.max(...s.rows.map(r=>r.length))*7+16),T=22,nc=s.cols.length,cw=(w-labW)/nc,ch=Math.min(36,Math.max(26,cw*.62)),M=Math.max(...s.values.flat()),f=s.fmt||fmtN;
    const mix=t=>{const a=[53,39,16],b=[240,192,96];return`rgb(${a.map((x,k)=>Math.round(x+(b[k]-x)*t)).join(',')})`};let m='';
    s.cols.forEach((c,j)=>m+=`<text class="tk" x="${labW+cw*j+cw/2}" y="13" text-anchor="middle">${esc(c)}</text>`);
    s.rows.forEach((r,i)=>{m+=`<text class="lab" x="${labW-10}" y="${T+i*ch+ch/2+4}" text-anchor="end">${esc(r)}</text>`;
      s.values[i].forEach((v,j)=>m+=`<rect class="cell" data-i="${i*nc+j}" x="${labW+cw*j+1}" y="${T+i*ch+1}" width="${cw-2}" height="${ch-2}" rx="4" fill="${mix(v/M)}"/>`)});
    return{html:svg(w,T+s.rows.length*ch,m)+`<div class="scale"><span>stil</span><i></i><span>druk (${f(M)})</span></div>`,
      tip:i=>{const r=Math.floor(i/nc),c=i%nc;return{title:`${s.rows[r]} · ${s.cols[c]}`,rows:[{v:f(s.values[r][c]),l:s.valName}]}}};
  },
  dots(s,w){
    const lh=44,T=18,labW=Math.min(Math.round(w*.35),Math.max(...s.lanes.map(l=>l.length))*7+18),bottom=T+s.lanes.length*lh,A=weekAxis(labW,w,14,T,bottom,s.now);let m='',b='';
    s.lanes.forEach((l,i)=>{const y=T+i*lh+lh/2;m+=`<text class="lab" x="${labW-10}" y="${y+4}" text-anchor="end">${esc(l)}</text><line class="gl" x1="${labW}" x2="${w-14}" y1="${y}" y2="${y}"/>`});
    s.items.forEach((it,i)=>{const x=A.X(it.t),y=T+s.lanes.indexOf(it.lane)*lh+lh/2;
      b+=`<g class="pt" data-i="${i}"><circle class="hit" cx="${x}" cy="${y}" r="13"/><circle class="mk ring" cx="${x}" cy="${y}" r="6" style="fill:var(--gold)"/></g>`});
    return{html:svg(w,bottom+26,A.g+m+b),tip:i=>{const it=s.items[i];return{title:it.when,rows:[{c:'var(--gold)',v:it.lane,l:''},{v:'',l:it.text}]}}};
  },
  pair(s,w){
    const side=w>=560,cw=side?Math.floor((w-24)/2):w,a=R.hbars(s.a,cw),b=R.hbars(s.b,cw),pre=(h,p)=>h.replace(/data-i="/g,`data-i="${p}`);
    return{html:`<div class="pair ${side?'two':''}"><div><h4>${s.a.title}</h4>${pre(a.html,'a')}</div><div><h4>${s.b.title}</h4>${pre(b.html,'b')}</div></div>`,
      tip:i=>(i[0]==='a'?a:b).tip(+i.slice(1))};
  },
};
// tabelweergave per grafiektype (zelfde data, zonder kleur)
const tbl=(head,rows)=>`<div class="dtw"><table class="dt"><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const TBL={
  cols:s=>tbl(['',...s.series.map(x=>x.name)],s.labels.map((l,i)=>[(s.tips||s.labels)[i],...s.series.map(se=>(s.fmt||fmtN)(se.values[i]||0))])),
  line:s=>tbl(['',...s.series.map(x=>x.name)],s.labels.map((l,i)=>[(s.tips||s.labels)[i],...s.series.map(se=>se.values[i]==null?'–':(s.fmt||fmtN)(se.values[i]))])),
  hbars:s=>tbl(['',...(s.series||[{name:s.valName}]).map(x=>x.name)],s.rows.map(r=>[r.label,...r.values.map(v=>s.diverging?fmtS(v):(s.fmt||fmtN)(v))])),
  heat:s=>tbl(['',...s.cols],s.rows.map((r,i)=>[r,...s.values[i].map(s.fmt||fmtN)])),
  dots:s=>tbl(['moment','soort','wat'],s.items.map(it=>[it.when,it.lane,it.text])),
  pair:s=>tbl(['',s.a.title,s.b.title],s.a.rows.map((r,i)=>[r.label,fmtN(r.values[0]),fmtN((s.b.rows[i]||{values:[]}).values[0])])),
};
// Een grafiek zonder meting (alles leeg of nul) toont de lege toestand, nooit een fout.
const vol=v=>v!=null&&v!==0;
function isLeeg(s){
  switch(s.type){
    case 'cols':case 'line':return s.labels.length<2||!s.series.some(se=>se.values.some(vol));
    case 'hbars':return !s.rows.length||!s.rows.some(r=>r.values.some(vol));
    case 'heat':return !s.rows.length||!s.values.some(r=>r.some(vol));
    case 'dots':return !s.items.length;
    case 'pair':return isLeeg(s.a)&&isLeeg(s.b);
  }
  return true;
}
const teken=(s,w)=>isLeeg(s)?{html:LEEG,tip:null}:R[s.type](s,w);
const tabel=s=>isLeeg(s)?LEEG:TBL[s.type](s);

// ── bouwstenen ──
const card=(k,title,sub,span)=>`<section class="card${span?' span2':''}"><header class="ch"><div><h3>${title}</h3>${sub?`<p>${sub}</p>`:''}</div><button class="tbtn" data-tbl="${k}" aria-pressed="false">Tabel</button></header><div class="chart" data-c="${k}" role="img" aria-label="${esc(title)}"></div></section>`;
const panel=(title,hint,body,hid,pk)=>`<details class="panel"><summary><span class="pk">${pk||'Bediening'}</span><span>${title}</span><span class="ph"${hid?` id="${hid}"`:''}>${hint}</span><span class="chev">▸</span></summary><div class="pb">${body}</div></details>`;
function tip(t){return ' <span class="info" data-tip="'+esc(t)+'" onclick="event.preventDefault()">i</span>'}
function spark(v){v=(v||[]).filter(x=>x!=null);const n=v.length;if(n<2)return'';const mx=Math.max(...v),mn=Math.min(...v),W=200,H=26,P=3,y=x=>P+(H-2*P)*(mx===mn?.5:1-(x-mn)/(mx-mn));
  return`<div class="sp" aria-hidden="true"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline points="${v.map((x,i)=>`${(i/(n-1)*W).toFixed(1)},${y(x).toFixed(1)}`).join(' ')}" fill="none" style="stroke:var(--dim)" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg><i style="top:${(y(v[n-1])/H*100).toFixed(1)}%"></i></div>`}
const meter=(v,max)=>max>0?`<div class="meter ${v/max>=1?'full':v/max>=.8?'warn':''}" role="meter" aria-valuenow="${+v}" aria-valuemax="${+max}"><i style="width:${Math.max(0,Math.min(100,v/max*100))}%"></i></div>`:'';
function kpi(l,v,o={}){return`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div>`+
  (o.delta?`<div class="dl ${o.delta.good?'good':'bad'}">${o.delta.up?'▲':'▼'} ${o.delta.t}</div>`:'')+(o.sub?`<div class="s">${o.sub}</div>`:'')+
  (o.meter?meter(...o.meter):'')+(o.spark?spark(o.spark):'')+'</div>'}
const pips=(v,max)=>`<span class="pips" aria-label="${v} van ${max}">${Array.from({length:max},(_,i)=>`<i class="${i<v?'f':''}"></i>`).join('')}</span>`;
const reeks=(x,naam)=>((((x||{}).reeksen||[]).find(q=>q.naam===naam)||{}).punten)||[];
function vandaagPunten(d){const v=(d.regie||{}).vandaag||[];
  return{ingrepen:v.filter(x=>x.laag==='ingreep').length,gegeven:sum(v.map(x=>Math.max(0,x.punten||0))),genomen:-sum(v.map(x=>Math.min(0,x.punten||0)))}}

function grafieken(d){
  const r=d.reeksen||{},kl=kleurVan(d),rl=(((d.stats||{}).ranglijst)||[]).slice(0,10),cas=(d.spel||{}).casino||{};
  const as=x=>(x&&x.labels)||[];
  const ser=(x,kleur)=>((x&&x.reeksen)||[]).map((q,i)=>({name:String(q.naam),color:kleur?kleur(q.naam,i):`var(--s${i%6+1})`,values:q.punten||[]}));
  const rij=(x,o)=>(x||[]).map(q=>Object.assign({label:String(q.label),values:[q.value]},o&&o(q)));
  const dag=x=>({labels:as(x).map(dl),tips:as(x).map(dlw)});
  const wk=as(r.puntenWeek),niv=NIV[(d.regie||{}).niveau]||0,vij=r.weekvijand||{},km=r.kaartenMaand||{},gh=((d.grafieken||{}).geschiedenis)||[];
  const SOORT={geven:1,nemen:2,casino:3,gril:4,toespraak:5,weekvijand:6}; // vaste kleur per soort, gelijk aan gegeven/genomen
  const ip=ser(r.ingrepenPerDag,(n,i)=>`var(--s${SOORT[n]||i%6+1})`),sk={};ip.forEach(s=>sk[s.name]=s.color);
  const geel=reeks(km,'geel'),rood=reeks(km,'rood'),act=ser(r.activiteitWeekdag);
  const vr=(r.verrassingen||[]).map(v=>({t:(Date.parse(v.dag)-Date.parse(wk[0]))/36e5+v.minuut/60,when:wd(v.dag)+' '+String(Math.floor(v.minuut/60)).padStart(2,'0')+':'+String(v.minuut%60).padStart(2,'0'),lane:String(v.id),text:dlw(v.dag)})).filter(v=>isFinite(v.t));
  return{
    ranglijst:{type:'pair',a:{type:'hbars',title:'Kroketpunten',valName:'kroketpunten',rows:rl.map(x=>({label:String(x.naam),values:[x.score||0],color:kl(x.naam)}))},

    activiteit:{type:'heat',rows:act.map(s=>s.name),cols:as(r.activiteitWeekdag),values:act.map(s=>s.values.map(v=>v||0)),valName:'berichten per dag',fmt:fmt1},
    kaarten:{type:'hbars',series:[{name:'geel',color:'var(--warn)'},{name:'rood',color:'var(--crit)'}],rows:as(km).map((l,i)=>({label:String(l),values:[geel[i]||0,rood[i]||0]}))},
    soorten:{type:'hbars',color:'var(--gold)',valName:'keer',rows:(((d.grafieken||{}).activiteitPerType)||[]).map(x=>({label:String(x.type),values:[x.aantal]}))},
    groei:{type:'line',area:true,endLabel:'value',labels:gh.map(x=>dl(x.datum)),tips:gh.map(x=>dlw(x.datum)),series:[{name:'totaalscore',color:'var(--gold)',values:gh.map(x=>x.totaalScore)}]},
    schatkist:{type:'line',area:true,endLabel:'value',...dag(r.schatkist),series:ser(r.schatkist,()=>'var(--gold)')},
    gegevenGenomen:{type:'cols',...dag(r.gegevenGenomen),series:ser(r.gegevenGenomen),refs:[{v:MAX_GEVEN,label:'max geven '+MAX_GEVEN},{v:MAX_NEMEN,label:'max nemen '+MAX_NEMEN}]},
    aflaten:{type:'hbars',color:'var(--gold)',valName:'omzet',rows:rij(r.aflaten,q=>({extra:[{v:fmtN(q.verkocht)+'×',l:'verkocht'}]}))},
    casinoInUit:{type:'cols',...dag(r.casinoPerDag),series:['ingezet','uitbetaald'].map((n,i)=>({name:n,color:`var(--s${i+1})`,values:reeks(r.casinoPerDag,n)}))},
    huiswinst:{type:'line',area:true,endLabel:'value',...dag(r.huiswinst),series:ser(r.huiswinst,()=>'var(--gold)')},
    spellen:{type:'hbars',color:'var(--gold)',valName:'spellen',rows:rij(r.spellen,q=>({label:String((cas.spelNamen||{})[q.label]||q.label),extra:[{v:fmtN(q.ingezet)+' pt',l:'ingezet'}]}))},
    winnaars:{type:'hbars',diverging:true,valName:'netto',rows:rij(r.winnaarsVerliezers)},
    ingrepenPerDag:{type:'cols',stacked:true,...dag(r.ingrepenPerDag),series:ip,refs:niv?[{v:niv,label:'max '+niv}]:[]},
    ingrepenPerId:{type:'hbars',valName:'keer',rh:28,rows:rij(r.ingrepenPerId,q=>({color:sk[q.soort]||'var(--gold)',extra:[{v:String(q.soort),l:'soort'}]})),legend:ip.map(s=>({name:s.name,color:s.color}))},
    verrassingen:{type:'dots',lanes:[...new Set(vr.map(v=>v.lane))],now:wk[0]?weekUur(d.nu,wk[0]):0,items:vr},
    hp:{type:'line',step:true,area:true,endLabel:'value',labels:as(vij).map(wd),tips:as(vij).map(dlw),series:ser(vij,()=>'var(--s2)'),refs:vij.maxHp?[{v:vij.maxHp,label:'start '+vij.maxHp+' HP'}]:[]},
    schade:{type:'hbars',valName:'schade',rows:rij(vij.schade,q=>({color:kl(q.label)}))},
    wapens:{type:'hbars',color:'var(--gold)',valName:'klappen',rows:rij(vij.wapens)},
    llm:{type:'cols',stacked:true,...dag(r.llm),series:ser(r.llm)},
  };
}

// ── cijfertegels per sectie ──
function kpis(d){
  const r=d.reeksen||{},st=d.stats||{},rg=d.regie||{},nb=d.nuBezig||{},raid=nb.raid||{},cas=(d.spel||{}).casino||{},cv=cas.vandaag||{},cw=cas.week||{},w=d.winkel||{},bot=d.bot||{};
  const vp=vandaagPunten(d),niv=NIV[rg.niveau]||0,afl=r.aflaten||[],vij=r.weekvijand||{},apd=((d.grafieken||{}).activiteitPerDag)||[];
  const sk=reeks(r.schatkist,'Schatkist'),skA=sk[sk.length-1],skB=sk[sk.length-2];
  const as2=x=>(x&&x.labels)||[];
  const perDag=x=>as2(x).map((_,i)=>sum(((x||{}).reeksen||[]).map(q=>q.punten[i])));
  const wkDagen=new Set(as2(r.puntenWeek)),gg=r.gegevenGenomen,wkSom=n=>sum(as2(gg).map((l,i)=>wkDagen.has(l)?reeks(gg,n)[i]:0));
  const llmDag=perDag(r.llm),ingrDag=perDag(r.ingrepenPerDag);
  const gegeven=kpi('Gegeven vandaag',`+${vp.gegeven}<small>/${MAX_GEVEN}</small>`,{meter:[vp.gegeven,MAX_GEVEN],sub:'punten door de regisseur'});
  const genomen=kpi('Genomen vandaag',`${vp.genomen?'−'+vp.genomen:0}<small>/${MAX_NEMEN}</small>`,{meter:[vp.genomen,MAX_NEMEN],sub:'punten door de regisseur'});
  return{
    live:kpi('Ingrepen vandaag',vp.ingrepen+(niv?`<small>/${niv}</small>`:''),{meter:[vp.ingrepen,niv],sub:'niveau '+esc(rg.niveau||'–')})+gegeven+genomen
      +kpi('Schatkist',fmtN(rg.schatkist||0),{spark:sk,sub:'laatste 21 dagen'})
      +kpi('Casino vandaag',`${fmtN(cv.spellen||0)} <small>spellen</small>`,{sub:cas.aan===false?'dicht':'open',spark:reeks(r.casinoPerDag,'spellen')}),
    spelers:kpi('Leden',fmtN(st.leden||0),{sub:fmtN((st.bans||[]).length)+' verbannen'})
      +kpi('Punten deze week',fmtN(sum((st.ranglijst||[]).map(x=>x.score))),{sub:'kroketpunten, alle leden'})
      +kpi('Gebeurtenissen',fmtN(sum(apd.map(x=>x.aantal))),{sub:'deze week, ma t/m zo',spark:apd.map(x=>x.aantal)})
      +kpi('Relikwieën',fmtN(st.achievements||0),{sub:'behaald'}),
    economie:kpi('Schatkist',`${fmtN(rg.schatkist||0)} <small>pt</small>`,{delta:skA!=null&&skB!=null&&skA!==skB?{t:fmtS(skA-skB)+' vs gisteren',up:skA>skB,good:skA>skB}:null,spark:sk})
      +gegeven+genomen
      +kpi('Aankopen deze week',fmtN(sum(afl.map(a=>a.verkocht))),{sub:fmtN(sum(afl.map(a=>a.value)))+' pt omzet in de Aflatenhandel'})
      +kpi('Actieve power-ups',fmtN((w.actief||[]).length),{sub:'en vloeken'}),
    casino:kpi('Spellen vandaag',fmtN(cv.spellen||0),{spark:reeks(r.casinoPerDag,'spellen'),sub:cas.aan===false?'casino dicht':'14 dagen'})
      +kpi('Ingezet vandaag',`${fmtN(cv.ingezet||0)} <small>pt</small>`,{spark:reeks(r.casinoPerDag,'ingezet')})
      +kpi('Uitbetaald vandaag',`${fmtN(cv.uitbetaald||0)} <small>pt</small>`,{spark:reeks(r.casinoPerDag,'uitbetaald')})
      +kpi('Huiswinst vandaag',fmtS((cv.ingezet||0)-(cv.uitbetaald||0)),{sub:'deze week '+fmtS((cw.ingezet||0)-(cw.uitbetaald||0))})
      +(cas.loterij?kpi('Loterijpot',`${fmtN(cas.loterij.pot)} <small>pt</small>`,{sub:fmtN(cas.loterij.loten)+' loten · trekking vr 16:00'}):''),
    regisseur:kpi('Ingrepen, 14 dagen',fmtN(sum(ingrDag)),{spark:ingrDag,sub:'max '+niv+' per dag'})
      +kpi('Verrassingen deze week',fmtN((r.verrassingen||[]).length),{sub:rg.verrassing?'er loopt er nu een':'nu geen'})
      +kpi('Niveau',esc(rg.niveau||'–'),{sub:'uit · laag · normaal · wild'})
      +kpi('Punten deze week',`+${fmtN(wkSom('gegeven'))} <small>/ −${fmtN(wkSom('genomen'))}</small>`,{sub:'gegeven / genomen'}),
    weekvijand:kpi('Vijand',raid.actief?esc(raid.naam):'geen',{sub:raid.actief?'in de strijd':'geen raid actief'})
      +kpi('HP',raid.actief?`${fmtN(raid.hp)}<small>/${fmtN(raid.maxHp)}</small>`:'–',{meter:raid.actief?[raid.hp,raid.maxHp]:null,sub:raid.actief?fmtN(raid.maxHp-raid.hp)+' schade':''})
      +kpi('Strijders',fmtN((vij.schade||[]).length),{sub:'deelden schade uit'})
      +kpi('Klappen',fmtN(sum((vij.wapens||[]).map(x=>x.value))),{sub:'met een wapen'}),
    systeem:kpi('Uptime',dur(bot.uptimeSec),{sub:esc(bot.status||'')})
      +kpi('Geheugen',`${fmtN(bot.memMb)} <small>MB</small>`,{sub:'rss'})
      +kpi('LLM-calls vandaag',fmtN(llmDag[llmDag.length-1]||0),{spark:llmDag,sub:'14 dagen'})
      +kpi('Kennisbank',fmtN(st.kennisbank||0),{sub:'entries'}),
  };
}

// ── wat loopt er (de strook Nu bezig) en wat deed hij vandaag ──
function effectChips(effs){
  return effs.map(e=>`<div class="chip"><span class="em">⏳</span><div class="grow"><b>${esc(e.id)}</b><small>tot ${uur(e.tot)} · <span class="cd" data-tot="${+e.tot}"></span></small></div><button class="btn sm dng" data-do="effectStop" data-id="${esc(e.id)}">beëindig</button></div>`).join('');
}
function renderNuBezig(d){
  const nb=d.nuBezig||{},rg=nb.regie||{},k=[];
  const kaart=(em,t,p,body)=>`<section class="card"><div class="mh"><div class="em">${em}</div><div><h3>${t}</h3>${p?`<p>${p}</p>`:''}</div></div>${body}</section>`;
  if((rg.effecten||[]).length)k.push(kaart('⏳','Lopende effecten','door de regisseur gezet',effectChips(rg.effecten)));
  if(rg.verrassing){const v=rg.verrassing,tot=v.id==='hete_kroket'&&v.data&&v.data.deadline?v.data.deadline:v.tot;
    k.push(kaart('🎁','Verrassing: '+esc(v.id),`tot ${uur(tot)} · <span class="cd" data-tot="${+tot}"></span>`,'<div class="row"><button class="btn sm dng" data-do="verrassingStop">beëindig</button></div>'))}
  if(rg.zaak)k.push(kaart('⚖️','Zaak tegen '+esc(rg.zaak.doel),esc(rg.zaak.grond)+' · sluit '+uur(rg.zaak.sluitTs),
    `<div class="kv"><span>Stemmen</span><b class="num">${fmtN(rg.zaak.stemmen)}</b></div><div class="row" style="margin-top:10px"><button class="btn sm dng" data-do="zaakStop">beëindig</button></div>`));
  const rd=nb.raid||{};
  if(rd.actief)k.push(kaart('👹','Weekvijand: '+esc(rd.naam),'',`<div class="hp" role="meter" aria-valuenow="${+rd.hp}" aria-valuemax="${+rd.maxHp}"><i style="width:${rd.maxHp?Math.round(rd.hp/rd.maxHp*100):0}%"></i></div>
    <div class="kv" style="margin-top:8px"><span>Leven</span><b class="num">${fmtN(rd.hp)} / ${fmtN(rd.maxHp)}</b></div>
    <div class="row" style="margin-top:10px"><button class="btn sm" data-actie="weekvijandBeurt">🗡️ beurt</button><button class="btn sm dng" data-actie="bamischijfOntsnap">afsluiten</button><a class="btn sm" href="#weekvijand" style="text-decoration:none">Naar de strijd ›</a></div>`));
  if((nb.veiling||{}).open)k.push(kaart('🔨','Veiling: open','de Grote Veiling loopt','<div class="row"><button class="btn sm gold" data-actie="veilingHamer">⚖️ hamer</button></div>'));
  if((nb.tribunaal||{}).fase)k.push(kaart('⚖️','Tribunaal','fase: '+esc(nb.tribunaal.fase),''));
  if((nb.gelekaart||{}).actief)k.push(kaart('🟨','Gele-kaartstemming','sluit '+uur(nb.gelekaart.sluitTs),'<div class="row"><button class="btn sm" data-actie="gelekaartSluiten">sluit stemming</button></div>'));
  if(nb.gokpauzes)k.push(kaart('🕯️',fmtN(nb.gokpauzes)+' op gokpauze','casinoverbod loopt','<div class="row"><a class="btn sm" href="#casino" style="text-decoration:none">Naar het casino ›</a></div>'));
  return k.join('')||kaart('😴','Niets loopt','geen effect, verrassing, zaak of strijd','');
}
// Alleen lezen: wat de Kroket God vandaag zelf deed (de regie-log van vandaag).
function renderVandaag(d){
  const v=(((d.regie||{}).vandaag)||[]).slice().sort((a,b)=>b.ts-a.ts),ic={ingreep:'🎬',verrassing:'🎁'};

// ── lijsten die elke 15 s opnieuw opgebouwd worden (alleen knoppen, geen invoervelden) ──
function lijsten(d){
  const st=d.stats||{},rg=d.regie||{},sp=d.spel||{},cs=sp.casino||{},w=d.winkel||{},L=d.llm||{},kl=kleurVan(d),vp=vandaagPunten(d),niv=NIV[rg.niveau]||0;

  const feed=(t,rows,leeg)=>`<div class="h4">${t}</div><div class="feed">${rows.join('')||`<span class="muted">${leeg}</span>`}</div>`;
  const dg=x=>new Date(x+'T12:00:00Z').toLocaleDateString('nl-NL',{weekday:'short',day:'numeric',month:'short'});
  const effecten=rg.effecten||[],bans=st.bans||[],gp=cs.gokpauze||[],ps=d.personas||[],ip=d.ingepland||[];

  // Spellen van vandaag (Live)

  const spellen='<div class="h4">👑 Troon van de Frituur</div>'+(t?`<div><b>${esc(t.koning)}</b> <small class="muted">sinds ${new Date(t.sinds).toLocaleDateString('nl-NL',{day:'numeric',month:'long'})} · ${fmtN(t.score)} kroketpunten · +1 kroontribuut per dag</small></div>`:'<div class="muted">De troon staat leeg; de eerste uitdager wordt zonder strijd gekroond.</div>')
    +'<div class="h4">🥇 Gouden Kroket</div>'+(g.gepakt?`<div>Gegrepen door <b>${esc(g.winnaar||'?')}</b>. De volgende jacht wordt maandag 09:35 ingepland.</div>`
      :g.geplaatst?'<div style="color:var(--gold);font-weight:700">Ligt nu in het kanaal, nog niet gegrepen!</div>'
      :g.geplandVoor?`<div>Verschijnt <b>${new Date(g.geplandVoor).toLocaleString('nl-NL',{weekday:'long',hour:'2-digit',minute:'2-digit'})}</b> <small class="muted">alleen jij ziet dit; de leden weten van niets</small></div>`
      :'<div class="muted">Geen jacht gepland; de volgende wordt maandag 09:35 ingepland.</div>')
    +'<div class="h4">🥖 Kroket van de dag en 🔮 gok</div>'+(kg.kroket?`<div><b>${esc(kg.kroket)}</b> <small class="muted">${kg.actief?'stemming loopt':'wacht op uitslag'}</small></div>`:'<div class="muted">nog geen kroket vandaag</div>')
      +li((kg.gokken||[]).map(x=>`<div class="li"><span class="grow">${esc(x.naam)}</span>${x.keuze==='krokant'?'🥖 krokant':'💀 slap korstje'}</div>`),'nog geen voorspellingen')
    +'<div class="h4">🧠 Quiz</div>'+(q?`<div>${esc(q.vraag)}</div><small class="muted">${q.afgerond?'afgerond, antwoord onthuld':'loopt, onthulling na '+uur(q.deadline)}</small>`:'<div class="muted">geen actieve quiz</div>')
    +'<div class="h4">🎯 Kroket-bingo</div>'+(bi?li((bi.opdrachten||[]).map(o=>`<div class="li"><span class="grow">${o.nr}. ${esc(o.tekst)}</span>${(o.claims||[]).length?`<small class="good">✓ ${esc(o.claims.join(', '))}</small>`:''}</div>`),'geen opdrachten'):'<div class="muted">geen bingokaart deze week</div>');

  // Aflatenhandel (Economie)
  const wIcon={};(w.catalogus||[]).forEach(c=>wIcon[c.key]=c.icoon);
  const winkel='<div class="h4">Nu actief</div>'+li((w.actief||[]).map(p=>`<div class="li"><b>${esc(p.naam)}</b><span class="grow">${esc(p.icoon)} ${esc(p.itemNaam)}${p.door?` <small>door ${esc(p.door)}</small>`:''} <small>nog ${dur((p.tot-d.nu)/1000)}</small></span><button class="btn sm dng" data-do="winkelWeg" data-id="${esc(p.userId)}" data-item="${esc(p.item)}">✕</button></div>`),'geen actieve power-ups of vloeken')
    +((w.totalen||[]).length?feed('Totalen per koper',w.totalen.map(x=>`<div class="row"><b>${esc(x.koper)}</b>: ${fmtN(x.aantal)}× gekocht, ${fmtN(x.besteed)} pt besteed <span class="muted">(${Object.keys(x.perItem||{}).map(k=>x.perItem[k]+'× '+esc(wIcon[k]||k)).join(' · ')})</span></div>`),''):'')
    +feed('Laatste aankopen',(w.historie||[]).map(x=>`<div class="row"><span class="t">${datum(x.ts)}</span> · <b>${esc(x.koper)}</b> ${esc(x.icoon)} ${esc(x.itemNaam)}${x.doel?' → '+esc(x.doel):''} <span class="muted">${x.prijs>0?fmtN(x.prijs)+' pt':'gratis'}${x.bron==='dashboard'?' · dashboard':''}</span></div>`),'nog geen aankopen');

  // Casino deze week
  const huis=x=>[fmtN(x.spellen),fmtN(x.ingezet),fmtN(x.uitbetaald),fmtS((x.ingezet||0)-(x.uitbetaald||0))];
  const cw=cs.week||{},lo=cs.loterij,gw=cw.grootste;
  const casino=`<p class="hint">${cs.aan===false?'<b class="bad">gesloten</b>':'open'} · max ${fmtN(cs.maxInzet)} per spel · ${fmtN(cs.perDag)} spellen per dag${cs.bonusVandaag?` · <b style="color:var(--gold)">+${fmtN(cs.bonusVandaag)} extra vandaag</b>`:''}${cs.schuifkast!=null?` · schuifkast: ${fmtN(cs.schuifkast)} munten op de tafel`:''}. "Huis" is wat het casino aan de spelers verdiende (plus) of verloor (min).</p>`
    +tbl(['','spellen','ingezet','uitbetaald','huis'],[['Vandaag',...huis(cs.vandaag||{})],['Deze week',...huis(cw)],...Object.keys(cw.perSpel||{}).map(k=>[(cs.spelNamen||{})[k]||k,...huis(cw.perSpel[k])])])
    +((cw.perLid||[]).length?'<div class="h4">Per lid, deze week</div>'+tbl(['lid','spellen','netto'],cw.perLid.map(x=>[x.naam,fmtN(x.spellen),fmtS(x.netto)])):'<p class="muted">deze week nog niet gespeeld</p>')
    +(gw?`<p>🏆 Grootste winst: <b>${esc(gw.naam)}</b> +${fmtN(gw.netto)} aan ${esc(gw.spel)}</p>`:'')
    +(lo?`<p>🎟️ Frituurloterij: pot <b>${fmtN(lo.pot)}</b> · ${fmtN(lo.loten)} loten van ${fmtN(lo.deelnemers)} leden · trekking vrijdag 16:00${lo.laatste?` · laatst gewonnen door <b>${esc(lo.laatste.naam)}</b> (+${fmtN(lo.laatste.pot)})`:''}</p>`:'')
    +((cs.feiten||[]).length?'<div class="h4">Gefluister deze week'+tip('Wat de casinoroddel van dinsdag 16:30 kan vertellen. Die kiest er vier, over de afgelopen zeven dagen.')+'</div>'+cs.feiten.map(f=>'<div>'+esc(f).replace(/\*([^*]+)\*/g,'<b>$1</b>')+'</div>').join(''):'');

  // Providers en quota (Systeem)
  const pr=(L.providers||[]).map(p=>{const cls=!p.actief||p.bank?'off':p.cooldown>0?'cool':'ok';
    const note=!p.actief?'geen key':p.bank?`bank (${esc(p.bank.status||'?')}${p.bank.trap?', trap '+p.bank.trap+'/3':''}), nog ${dur(p.bank.restSec)}`:p.cooldown>0?'cooldown '+dur(p.cooldown):'<span class="good">vrij</span>';
    return`<div class="kv"><span><i class="dot ${cls}"></i> ${esc(p.naam)} <small>${esc(p.tier)}</small></span><b>${note}</b></div>`});
  const gq=L.groq,qr=x=>Number(x)||0;

    <div><div class="h4">Gemini-keys</div>${(L.geminiKeys||[]).map(k=>`<div class="kv"><span><i class="dot ${k.vrij?'ok':'cool'}"></i> Gemini-key #${+k.nr}</span><b>${k.vrij?'<span class="good">vrij</span>':'vrij over '+dur(k.resetOver)}</b></div>`).join('')||'<div class="muted">geen keys</div>'}

    'r-bans':li(bans.map(b=>`<div class="li"><div class="grow"><b>${esc(b.naam)}</b> <small>tot ${datum(b.tot)}${b.reden?' · '+esc(b.reden):''}</small></div><button class="btn sm" data-do="ban" data-id="${esc(b.id)}" data-wat="opheffen">vrij</button><button class="btn sm" data-do="ban" data-id="${esc(b.id)}" data-wat="verlengen">+4u</button></div>`),'geen actieve verbanningen')
      +((st.vergrijpen||[]).length?'<div class="h4">Vergrijpen (7 dagen)</div>'+li(st.vergrijpen.map(v=>`<div class="li"><span class="grow">${esc(v.naam)}</span><b class="num">${fmtN(v.aantal)}</b></div>`),''):''),
    'h-bans':fmtN(bans.length)+' actief',
    'r-verbonden':li((sp.allianties||[]).map(x=>`<div class="li">⚔️ ${esc(x.a)} ↔ ${esc(x.b)}</div>`),'geen actieve allianties')
      +((sp.streaks||[]).length?'<div class="h4">Vrijdagstreaks</div>'+li(sp.streaks.map(s=>`<div class="li"><span class="grow">🔥 ${esc(s.naam)}</span><span class="num">${fmtN(s.huidig)} (record ${fmtN(s.record)})</span></div>`),''):''),
    'r-winkel':winkel,
    'h-winkel':fmtN((w.actief||[]).length)+' actief',
    'r-casino':casino,
    'r-gokpauze':`<p class="hint">De onzichtbare reeks: wie ${fmtN(cs.reeksLengte)} werkdagen op rij in het casino speelt (het weekend telt niet), komt op de zwarte lijst: een privé-waarschuwing, een openbare melding in het kanaal en de twee werkdagen erna een verbod op casino, Vetbad, gok, duel, roof, troon en aandelen kopen. De leden zien hun reeks niet; jij wel. "Opheffen" haalt een verbod weg.</p>`
      +li(gp.map(x=>{const s=x.rustdag&&x.rustdag<=cs.dag?`<b class="bad">casinoverbod t/m ${dg(x.rustTot)}</b>${x.pogingen?' · '+fmtN(x.pogingen)+'× geprobeerd':''}`
        :x.rustdag?`verbod ${dg(x.rustdag)} t/m ${dg(x.rustTot)}${x.gewaarschuwd?' · gewaarschuwd':' · nog niet gewaarschuwd'}`:`reeks ${fmtN(x.reeks)}/${fmtN(cs.reeksLengte)}`;
        return`<div class="li"><b class="grow">${esc(x.naam)}</b><small>${s}</small>${x.rustdag?`<button class="btn sm" data-do="gokpauze" data-id="${esc(x.userId)}" data-naam="${esc(x.naam)}">opheffen</button>`:''}</div>`}),'niemand in een reeks'),

    'r-effecten':`<div class="row" style="margin-bottom:12px"><span class="muted">Niveau</span><div class="seg" role="group">${['uit','laag','normaal','wild'].map(n=>`<button type="button" class="${n===rg.niveau?'on':''}" data-do="niveau" data-v="${n}">${n}</button>`).join('')}</div><span class="muted">Schatkist <b style="color:var(--txt)">${fmtN(rg.schatkist||0)} pt</b></span></div>`
      +(effecten.length?effectChips(effecten):'<div class="muted">geen lopende effecten</div>'),

      +feed('Activiteit deze week',(d.activiteit||[]).map(e=>`<div class="row"><span class="t">${datum(e.ts)}</span> · <b>${esc(e.type)}</b> ${e.naam?esc(e.naam)+': ':''}<span class="muted">${esc(e.beschrijving||'')}</span>${e.actorNaam?` <small class="muted">door ${esc(e.actorNaam)}</small>`:''}</div>`),'geen activiteit deze week'),

function badges(d){
  const nb=d.nuBezig||{},rg=nb.regie||{},cas=(d.spel||{}).casino||{},rd=nb.raid||{};

  return{live:n?n+' lopend':'',casino:cas.aan===false?'dicht':'',weekvijand:rd.actief?fmtN(rd.hp)+' HP':''};
}

// ── formulieren: één keer opgebouwd na de eerste data, daarna nooit meer (verversen wist niets) ──
function formulieren(d){
  const s=d.instellingen||{},w=d.winkel||{},cas=(d.spel||{}).casino||{};
  const leden=(w.leden||[]).map(r=>`<option value="${esc(r.id)}">${esc(r.naam)}</option>`).join('');
  const items=(w.catalogus||[]).map(c=>`<option value="${esc(c.key)}">${esc(c.icoon)} ${esc(c.naam)} (${fmtN(c.prijs)} pt)</option>`).join('');
  const moods=['<option value="">— automatisch —</option>'].concat((d.stemmingOpties||[]).map(m=>`<option value="${esc(m)}"${s.stemmingOverride===m?' selected':''}>${esc(m)}</option>`)).join('');
  const chk=(id,v,l,t)=>`<label class="sw"><span>${l}${t?tip(t):''}</span><input type="checkbox" id="${id}"${v?' checked':''}></label>`;

  const provs=(d.providerOpties||[]).map(p=>`<label class="sw"><span>${esc(p)}</span><input type="checkbox" data-prov="${esc(p)}"${(s.providerUit||[]).indexOf(p)>=0?' checked':''}></label>`).join('');
  const pct=Math.round((s.decreetIntensiteit||0)*100);
  return{
    'f-instellingen':`<div class="fgrid">

    <label class="field"><span>Dagstemming${tip('De dagelijkse bui die alle reacties kleurt. Automatisch kiest elke dag een vaste stemming op basis van de datum; of kies er zelf een. Werkt direct na opslaan.')}</span><select id="i_stemming">${moods}</select></label>
    <label class="field"><span>App Home-versie${tip('klassiek = oude Home voor iedereen, beta = alleen de eigenaar ziet Home 2.0, iedereen = Home 2.0 voor alle leden (met automatische terugval).')}</span><select id="i_homeVersie">${['klassiek','beta','iedereen'].map(n=>`<option value="${n}"${(s.homeVersie||'beta')===n?' selected':''}>${n}</option>`).join('')}</select></label>
    ${chk('i_stil',s.stilModus,'Stil-modus (mute)','De Kroket God reageert nergens meer op, behalve in het testkanaal. Handig bij onderhoud.')}
    ${chk('i_weekend',s.weekendRust,'Weekend-rust','Aan = rust in het weekend (geen reacties). Uit = reageert ook in het weekend.')}
    ${chk('i_menties',s.menties,'@-vermelding onder spelberichten','Uit = niemand wordt getagd; de namen staan toch al vet in het bericht en in een kanaal van vijf leest iedereen alles. Aan = wie een spelactie passief overkomt (de uitgedaagde, de bestolene, de bondgenoot) krijgt een @-vermelding onderaan. Wie de actie zelf uitvoerde wordt nooit getagd. Voor dingen die je anders mist bestaat de verborgen statusmelding hieronder al.')}
    ${chk('i_dm',s.statusMeldingen,'Verborgen statusmelding','Aan = het lid krijgt een bericht dat alleen hij ziet ("only visible to you") als een zegen verloopt, een verbanning eindigt of een titel van eigenaar wisselt. Alleen dingen die WEGvallen; wat je erbij krijgt wordt al in het kanaal omgeroepen. Ephemerals verdwijnen bij een client-herlaad, dus de wijzigingen staan ook in de App Home.')}
    ${chk('i_test',s.alleenTestkanaal,'Alleen testkanaal','Reageert uitsluitend in het testkanaal (bruin-schaap), om te testen zonder het hoofdkanaal te storen.')}
    ${chk('i_spaar',s.spaarstand,'Spaarstand (licht)','Forceert het lichte, goedkope model en slaat Gemini en Cerebras over. Bespaart schaarse quota, iets lagere kwaliteit.')}
    ${chk('i_allianties',s.alliantiesActief,'Allianties actief','Uit = alle heilige verbonden zijn GEPAUZEERD. De verbonden blijven bestaan en vervallen niet (ze staan nog in het overzicht en in ieders dossier), maar ze geven en kosten voorlopig niets: geen Verbondszegen bij puntenwinst, geen solidariteitsbonus bij een relikwie, geen verbondstrouw bij eer, geen pact-bescherming bij een beroep, en een bondgenoot valt niet mee in een verbanning. Ook de beschermingen liggen stil: tijdens de pauze mag een lid zijn eigen bondgenoot duelleren en beroven. Er kunnen geen verbonden gesloten of verbroken worden zolang dit uit staat. Zet je het weer aan, dan doen alle bestaande verbonden meteen weer mee.')}
    ${chk('i_straattaal',s.straattaal,'Straattaalmodus','Aan = de Kroket God spreekt straattaal. Zijn karakter, macht en formaten blijven precies hetzelfde (hij oordeelt, decreteert en straft nog steeds), alleen zijn woordkeus verandert: wollah, ouleh, yusu, drerrie, niffo, tantoe, safi. Plus een eigen kroketleer-woordenboek (krokku voor kroketpunten, goudbruin voor perfect, slappo, magnetrontje, korstwollah, uitgefrituurd). Werkt direct na opslaan en geldt voor alles wat hij zegt, overal. Uit = de gewone plechtige stem.')}
    ${chk('i_emojiRegels',s.emojiRegels!==false,'Emoji: vaste regels','De Kroket God zet stil één emoji op een bericht dat erom vraagt: 🚨 ketchup op een kroket, 🧢 bluf, 🤡 opscheppen, 🎂 verjaardag, 👁️ wie het óver hem heeft, en eigen emoji als :ohhellno: (airfryer), :shame-nun: (excuses), :sad-cat: (punten kwijt), :elmo-money: (lenen), :bosschebol: en :worstenbrood: (lib/emojireacties.js). Geen LLM. De Duitse vlag voor wie een ander erbij lapt, staat hier los van en blijft altijd aan.')}
    ${chk('i_emojiSlim',s.emojiSlim!==false,'Emoji: slimme laag','Bij een deel van de berichten zonder regel kiest een klein model uit 18 reacties: 😏 sarcasme, 🙄 zeuren, 🍿 drama, 🔥 sterk punt, 👑 gelijk, ⚖️ oordeel, plus twaalf eigen emoji (:facepalm:, :this-is-fine:, :uno_reverse:, :party_parrot:, :panic: …), of meestal niets. Kost één Groq-call per beoordeeld bericht, nooit Gemini.')}
    <label class="numl"><span>Emoji-frequentie${tip('Laag: hoogstens 3 per uur, per persoon één per uur, de helft van de regelkansen, en de slimme laag kijkt naar 1 op de 10 berichten. Normaal: 8 per uur, één per persoon per 20 minuten. Hoog: 15 per uur. Zeldzaam is bijzonder.')}</span><select id="i_emojiFreq">${['laag','normaal','hoog'].map(f=>`<option value="${f}"${(s.emojiFrequentie||'laag')===f?' selected':''}>${f}</option>`).join('')}</select></label>
  </div>
  <div><div class="h4">Providers uit${tip('Vink een LLM-provider aan om hem tijdelijk uit de antwoord-keten te halen, bv. bij een storing. Er blijft altijd minstens een werkend model over.')}</div>${provs}
    <div class="h4" style="margin-top:16px">Kansen</div>
    ${num('i_kortaf',s.kortafKans,'Kortaf-grap','Kans dat de Kroket God op een mention van een enkel woord (bv. kroket) heel droog antwoordt met OK of een emoji, i.p.v. een tirade.')}
    ${num('i_warrig',s.warrigKans,'Warrig','Kans dat een reactie het warrige formaat krijgt: de Kroket God dwaalt af alsof hij te lang in de frituurwalm stond.')}
    ${num('i_vrijdag',s.vrijdagAppendKans,'Vrijdag-append','Kans dat er een aftelling tot het heilige vrijdagmoment (12:00) aan een reactie wordt geplakt.')}
  </div>
</div>
<label class="field" style="margin-top:14px"><span>Decreet van de dag${tip('Vrije tekst die als extra instructie in de system prompt wordt geinjecteerd. Geef de Kroket God een tijdelijk thema, bv. spreek vandaag uitsluitend in haiku. Werkt direct na opslaan.')}</span><textarea id="i_decreet" rows="2" placeholder="bv. Vandaag spreekt de Kroket God uitsluitend in haiku.">${esc(s.decreetVanDeDag)}</textarea></label>
<label class="field" style="margin-top:12px"><span>Heftigheid van het decreet${tip('Hoe sterk de Kroket God het decreet doorvoert: links = subtiele vleug, rechts = absolute obsessie die elke reactie doordrenkt.')} <span id="i_decreetIntPct" class="muted">${pct}%</span></span><input type="range" min="0" max="100" id="i_decreetInt" value="${pct}" style="accent-color:var(--amber)"></label>
<label class="field" style="margin-top:12px"><span>Eer: huisonderwerpen${tip('Komma-gescheiden lijst van zaken die binnen dit genootschap sowieso zwaarder wegen bij een eerbewijs. Raakt een ingetypte reden er een, dan gaat het oordeel van de jury een klasse omhoog: zwak wordt degelijk, sterk wordt legendarisch. Bedoeld voor dingen die een taalmodel onmogelijk kan weten. Werkt direct na opslaan, ook op verbogen vormen en ongeacht hoofdletters.')}</span><input id="i_huis" type="text" value="${esc(s.eerHuisonderwerpen||'')}" placeholder="tavernehoek, de kelder"></label>
<div class="row" style="margin-top:14px"><button class="btn gold" data-save>💾 Opslaan</button><button class="btn" data-actie="resetCooldowns">♻️ Reset cooldowns</button><button class="btn" data-actie="ververseQuota">📊 Ververs quota</button><button class="btn" data-actie="statusMeldingen">📬 Statusmeldingen nu sturen</button><button class="btn" data-actie="appHomeVerversen">🏠 App Home verversen</button></div>`,
    'f-casino':`<div class="fgrid"><div>${chk('i_casinoAan',s.casinoAan!==false,'Casino open','Uit = /kroketgod casino en de knop in de Home-tab melden dat het casino gesloten is. Een open hand blijft bewaard tot het weer opengaat.')}</div>
  <label class="field"><span>Max inzet per spel${tip('Hoogstens zoveel kroketpunten per spel, en nooit meer dan de helft van iemands bezit. 1 tot 10.')}</span><input type="number" min="1" max="10" id="i_casinoMax" value="${+(s.casinoMaxInzet||5)}"></label>
  <label class="field"><span>Spellen per dag per lid${tip('Alle casinospellen samen. 1 tot 50.')}</span><input type="number" min="1" max="50" id="i_casinoPerDag" value="${+(s.casinoPerDag||10)}"></label></div>
<div class="row" style="margin-top:12px"><button class="btn gold" data-save>💾 Opslaan</button></div>`,
    'f-bonus':`<p class="hint">Geeft iedereen vandaag zoveel spellen bovenop het normale aantal, zoals bij een decreet. Om middernacht vervalt het; 0 = geen extra. Werkt los van Opslaan.</p>
<div class="row"><input type="number" min="0" max="50" id="i_casinoBonus" value="${+(cas.bonusVandaag||0)}" aria-label="Extra spellen vandaag"><button class="btn gold" data-do="bonus">🎰 Geef extra spellen</button><span id="cb_status" class="muted"></span></div>`,
    'f-winkel':`<div class="row"><select id="w_lid">${leden}</select><select id="w_item">${items}</select><label class="tog"><input type="checkbox" id="w_aankondig" checked> aankondigen</label><button class="btn gold" data-winkel="geef">🎁 Geef</button><button class="btn" data-winkel="verwijder">🗑️ Verwijder</button></div>`,
    'f-eer':`<p class="hint">Laat een lid een ander lid eren, precies zoals in Slack. De reden is verplicht: een onafhankelijke jury weegt hem als schraal, deugdelijk, sterk of legendarisch, en daarbinnen bepaalt een dobbel de uitkomst (0 tot 5 kroketpunten). Een schrale reden kan op niets uitlopen en kost de gever wel een eerbewijs. De daglimiet van de gever geldt, dezelfde reden hergebruiken weegt automatisch het laagst, en wie zijn eigen bondgenoot eert krijgt precies 1 punt terug. Voor stille correcties is er het scorebeheer.</p>
<div class="row"><span class="muted">van</span><select id="e_gever">${leden}</select><span class="muted">eert</span><select id="e_ontvanger">${leden}</select></div>
<textarea id="e_reden" rows="2" maxlength="300" placeholder="Waarvoor? Beschrijf de daad, niet het gevoel, bv. bleef tot acht uur om mijn deploy te repareren" style="margin-top:8px"></textarea>
<div class="row" style="margin-top:8px"><button class="btn gold" data-eer>🙏 Eer bewijzen</button></div>`,
  };
}

<script>
'use strict';
// ── App: DOM, verversen, navigatie, tooltip en de acties (alles achter het Bearer-token) ──
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let _tok='',ingesteld=false,_personas={},fresh=0;
const CH={};

$('#sidenav').innerHTML=SECS.map(s=>`<a class="nav" href="#${s[0]}"><span class="ic">${s[1]}</span>${s[2]}<span class="badge${s[0]==='live'?' hot':''}" data-b="${s[0]}" hidden></span></a>`).join('');
$('#tabbar').innerHTML=SECS.map(s=>`<a class="tab" href="#${s[0]}"><span class="ic">${s[1]}</span>${s[3]}</a>`).join('');
$('#main').innerHTML=SECS.map(s=>`<div class="sec" id="s-${s[0]}">${SKEL[s[0]]}</div>`).join('');

// grafieken: tekenen bij elke breedte-wijziging (ook als een verborgen sectie zichtbaar wordt)
function draw(box,force){
  const w=Math.floor(box.clientWidth);if(!w||(box._w===w&&!force))return;box._w=w;const s=CH[box.dataset.c];
  if(!s){box.innerHTML='';return}
  if(box.dataset.mode==='table'){box.innerHTML=tabel(s);box._tip=null;return}
  const r=teken(s,w);box.innerHTML=r.html;box._tip=r.tip;
}
const ro=new ResizeObserver(es=>es.forEach(e=>draw(e.target)));
$$('.chart').forEach(b=>ro.observe(b));

// navigatie: sectie in de URL-hash; laatste sectie in localStorage (als dat mag)
function show(id){
  if(!SECS.some(s=>s[0]===id))id='live';const s=SECS.find(x=>x[0]===id);
  $$('.sec').forEach(e=>e.classList.toggle('on',e.id==='s-'+id));
  $$('.nav,.tab').forEach(a=>a.getAttribute('href')==='#'+id?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
  $('#title').innerHTML=`<span>${s[1]} ${s[2]}</span><small>${s[4]}</small>`;
  try{localStorage.setItem('dash_sec',id)}catch(_){}
  hideTip();
}
function ga(id){show(id);try{if(location.hash!=='#'+id)history.pushState(null,'','#'+id)}catch(_){}window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));

// tooltip: één voor de hele pagina, inhoud via textContent
const tipEl=$('#tip');let hot=null;
function hideTip(){tipEl.classList.remove('on');if(hot)hot.classList.remove('hot');hot=null}
function onPt(e){
  const t=e.target.closest&&e.target.closest('[data-i]'),box=t&&t.closest('.chart');
  if(!t||!box||!box._tip){hideTip();return}
  if(hot!==t){if(hot)hot.classList.remove('hot');t.classList.add('hot');hot=t;
    const d=box._tip(t.dataset.i);tipEl.replaceChildren();
    const h=document.createElement('div');h.className='tt';h.textContent=d.title;tipEl.append(h);
    d.rows.forEach(r=>{const row=document.createElement('div');row.className='tr';
      if(r.c){const k=document.createElement('i');k.style.background=r.c;row.append(k)}
      const b=document.createElement('b');b.textContent=r.v;const l=document.createElement('span');l.textContent=r.l;row.append(b,l);tipEl.append(row)});
    tipEl.classList.add('on')}
  const W=tipEl.offsetWidth,H=tipEl.offsetHeight;let x=e.clientX+14,y=e.clientY+14;
  if(x+W>innerWidth-8)x=e.clientX-W-14;if(y+H>innerHeight-8)y=e.clientY-H-14;
  tipEl.style.transform=`translate(${Math.max(8,x)}px,${Math.max(8,y)}px)`;
}
document.addEventListener('pointermove',onPt);document.addEventListener('pointerdown',onPt);
window.addEventListener('scroll',hideTip,{passive:true});

const toast=$('#toast');let tt;
function say(m){toast.textContent=m;toast.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('on'),2600)}

// ── verversen: tegels, grafieken en lijsten; formulieren alleen de eerste keer ──
function render(d){
  const bot=d.bot||{};
  $('#status').className='pill '+(bot.status==='online'?'on':'off');$('#status_t').textContent=bot.status||'?';
  $('#uptime').textContent=dur(bot.uptimeSec)+' · '+fmtN(bot.memMb)+' MB';
  $('#mood').textContent='stemming: '+(bot.stemming||'—');
  $('#vrijdag').textContent=bot.weekend?'weekend, heilig moment geweest':'vrijdag 12:00 over '+dur(bot.vrijdagSec);
  const k=kpis(d);for(const id in k){const e=document.getElementById('kp-'+id);if(e)e.innerHTML=k[id]}
  const l=lijsten(d);for(const id in l){const e=document.getElementById(id);if(e)e.innerHTML=l[id]}
  const b=badges(d);$$('[data-b]').forEach(e=>{const t=b[e.dataset.b]||'';e.textContent=t;e.hidden=!t});
  Object.assign(CH,grafieken(d));hideTip();$$('.chart').forEach(x=>{x._w=0;draw(x)});
  _personas={};(d.personas||[]).forEach(p=>{_personas[p.id]=p});
  const sel=$('#i_regieNiveau');if(sel&&document.activeElement!==sel)sel.value=(d.regie||{}).niveau||'normaal';
  if($('#logzoek').value)filterLogs();
  fresh=0;tel();
}
function zetStatus(t){$('#status').className='pill off';$('#status_t').textContent=t}
function tick(){
  const tok=getToken();document.body.classList.add('refreshing');
  fetch('/api/stats',{headers:tok?{'Authorization':'Bearer '+tok}:{}})
    .then(r=>{if(r.status===401){showLogin();zetStatus('toegangscode vereist');return null}return r.json()})
    .then(d=>{if(!d)return;if(d.error)throw new Error(d.error);
      if(!ingesteld){const f=formulieren(d);for(const id in f){const e=document.getElementById(id);if(e)e.innerHTML=f[id]}ingesteld=true}
      render(d)})
    .catch(e=>{console.error(e);zetStatus('offline')})
    .then(()=>setTimeout(()=>document.body.classList.remove('refreshing'),300));
}
// elke seconde: "bijgewerkt" en de aftellers van lopende effecten
const left=ms=>{if(ms<=0)return'verlopen';const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`nog ${h}u ${String(m).padStart(2,'0')}m`:`nog ${m}:${String(s%60).padStart(2,'0')}`};
function tel(){$('#fresh').textContent=fresh<3?'zojuist':fresh+'s geleden';const n=Date.now();$$('.cd').forEach(e=>{e.textContent=left(+e.dataset.tot-n)})}

// ── token: localStorage als het mag, anders alleen in het geheugen (privévenster, data:-URL) ──
function getToken(){try{return localStorage.getItem('dashboard_token')||_tok}catch(_){return _tok}}
function saveToken(){const t=$('#login_token').value.trim();if(!t)return;_tok=t;try{localStorage.setItem('dashboard_token',t)}catch(_){}$('#login_overlay').style.display='none';tick()}
function showLogin(){$('#login_overlay').style.display='flex'}
function post(url,body,okmsg,statusId){var st=typeof statusId==='object'?statusId:document.getElementById(statusId||'i_status');if(st)st.textContent='…';var tok=getToken();return fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':tok?'Bearer '+tok:''},body:JSON.stringify(body)}).then(function(r){return r.json();}).then(function(j){if(j.error&&j.error.indexOf('DASHBOARD_TOKEN')!==-1){showLogin();return;}var m=j.ok?((j.bericht||okmsg)+' ✓'):('Fout: '+(j.error||''));if(st)st.textContent=m;say(m);}).catch(function(){if(st)st.textContent='Fout';say('Fout');});}
const later=ms=>()=>setTimeout(tick,ms||800);

var verkondigBezig=false;
function verkondig(modus){
  if(verkondigBezig)return;
  var spans=document.querySelectorAll('.v_status');
  var st={set textContent(t){spans.forEach(function(s){s.textContent=t;});}};
  var klaar=function(){verkondigBezig=false;setTimeout(tick,800);};
  if(modus==='vertaal'){
    var inp=document.getElementById('i_v_in').value.trim();
    if(!inp){st.textContent='Typ eerst een boodschap.';return;}
    st.textContent='Vertalen…';
    var tok=getToken();
    fetch('/api/verkondig',{method:'POST',headers:{'Content-Type':'application/json','Authorization':tok?'Bearer '+tok:''},body:JSON.stringify({tekst:inp,vertaal:true})}).then(function(r){return r.json();}).then(function(j){if(j.error&&j.error.indexOf('DASHBOARD_TOKEN')!==-1){showLogin();return;}if(j.ok){document.getElementById('i_v_out').value=j.verkondiging;st.textContent='Vertaald ✓ — controleer en klik Verkondig nu of Inplannen';}else st.textContent='Fout: '+(j.error||'');}).catch(function(){st.textContent='Fout';});
  }else{
    var out=document.getElementById('i_v_out').value.trim();
    if(!out){st.textContent='Klik eerst Vertaal (of typ zelf de Kroket God-tekst in het onderste veld).';return;}
    var kanaal=document.getElementById('i_v_kanaal').value;
    if(modus==='plan'){
      var tv=document.getElementById('i_v_tijd').value;
      if(!tv){st.textContent='Kies eerst een datum/tijd om in te plannen.';return;}
      var ms=new Date(tv).getTime();
      if(!ms||ms<Date.now()){st.textContent='Kies een tijdstip in de toekomst.';return;}
      verkondigBezig=true;post('/api/verkondig',{tekst:out,kanaal:kanaal,vertaal:false,wanneer:ms},'Ingepland',st).then(klaar,klaar);
    }else{
      verkondigBezig=true;post('/api/verkondig',{tekst:out,kanaal:kanaal,vertaal:false},'Verkondigd',st).then(klaar,klaar);
    }
  }
}
