// Een eigen plaatje als avatar bij persona bewerken: verkleinen, uploaden, link in het avatarveld.
function personaBestandGekozen(){
  var inp=document.getElementById('p_bestand'),f=inp.files[0],st=document.getElementById('p_status');
  if(!f)return;
  if(st)st.textContent='Plaatje uploaden…';
  verkleinAfbeelding(f,function(d){
    if(!d){if(st)st.textContent='Dat plaatje kon ik niet lezen.';inp.value='';return;}
    var tok=getToken();
    fetch('/api/avatar',{method:'POST',headers:{'Content-Type':'application/json','Authorization':tok?'Bearer '+tok:''},body:JSON.stringify({afbeelding:d,naam:document.getElementById('p_naam').value.trim()})})
      .then(function(r){return r.json();})
      .then(function(j){
        if(!j.ok){if(st)st.textContent='Uploaden mislukt: '+(j.error||'');return;}
        document.getElementById('p_icoon').value=j.url;updateIconPreview();
        if(st)st.textContent='Plaatje staat klaar; klik op Opslaan om het te bewaren.';
      })
      .catch(function(){if(st)st.textContent='Uploaden mislukt.';})
      .then(function(){inp.value='';});
  });
}
// Het plaatje wordt hier al verkleind tot 512 px (JPEG): de server leest hoogstens 1 MB per verzoek.
var _gastAfbeelding=null;
function verkleinAfbeelding(bestand,klaar){
  var r=new FileReader();
  r.onload=function(){
    var img=new Image();
    img.onload=function(){
      var s=Math.min(1,512/Math.max(img.width,img.height));
      var c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));
      var ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);
      klaar(c.toDataURL('image/jpeg',0.85));
    };
    img.onerror=function(){klaar(null);};
    img.src=r.result;
  };
  r.onerror=function(){klaar(null);};
  r.readAsDataURL(bestand);
}
function gastBestandGekozen(){
  var f=document.getElementById('g_bestand').files[0],pv=document.getElementById('g_preview'),st=document.getElementById('g_status');
  _gastAfbeelding=null;pv.style.display='none';
  if(!f)return;
  verkleinAfbeelding(f,function(d){_gastAfbeelding=d;if(d){pv.src=d;pv.style.display='';if(st)st.textContent='';}else if(st)st.textContent='Dat plaatje kon ik niet lezen.';});
}
function gastUitnodigen(){

  st.textContent='De Raad schrijft het karakter uit… (± 15 s)';knop.disabled=true;
  var tok=getToken();
  fetch('/api/gast',{method:'POST',headers:{'Content-Type':'application/json','Authorization':tok?'Bearer '+tok:''},body:JSON.stringify(body)})
    .then(function(r){return r.json();})
    .then(function(j){
      knop.disabled=false;
      if(j.error&&j.error.indexOf('DASHBOARD_TOKEN')!==-1){showLogin();st.textContent='';return;}
      if(!j.ok){st.textContent='Fout: '+(j.error||'');return;}
      st.textContent=j.bericht+' ✓';
      ['g_naam','g_trefwoord','g_beschrijving','g_link','g_bestand'].forEach(function(id){document.getElementById(id).value='';});
      _gastAfbeelding=null;document.getElementById('g_preview').style.display='none';

}

var _wizardVragen=[];
function personaVragen(){
  var naam=document.getElementById('p_naam').value.trim();
  var st=document.getElementById('p_status');
  if(!naam){if(st)st.textContent='Vul eerst een naam in.';return;}
  if(st)st.textContent='De AI bedenkt 3 vragen…';
  var tok=getToken();
  fetch('/api/persona/vragen',{method:'POST',headers:{'Content-Type':'application/json','Authorization':tok?'Bearer '+tok:''},body:JSON.stringify({naam:naam})})
    .then(function(r){return r.json();})
    .then(function(j){
      if(j.error&&j.error.indexOf('DASHBOARD_TOKEN')!==-1){showLogin();return;}
      if(!j.ok){if(st)st.textContent='Fout: '+(j.error||'');return;}
      _wizardVragen=j.vragen;
      var html=j.vragen.map(function(v,i){
        return '<div class="lbl">'+(i+1)+'. '+esc(v)+'</div><input type="text" id="p_antwoord_'+i+'" style="width:100%">';
      }).join('')
      +'<div style="margin-top:10px"><button class="btn gold" data-persona-genereer>✨ Genereer persona</button></div>';
      document.getElementById('p_wizard_vragen').innerHTML=html;
      if(st)st.textContent='Beantwoord de vragen en klik Genereer persona.';
    })
    .catch(function(){if(st)st.textContent='Fout bij het ophalen van de vragen.';});
}
function personaGenereer(){
  var naam=document.getElementById('p_naam').value.trim();
  var st=document.getElementById('p_status');
  if(!naam||_wizardVragen.length<3){if(st)st.textContent='Doorloop eerst stap 1 (bedenk vragen).';return;}
  var antwoorden=_wizardVragen.map(function(v,i){var el=document.getElementById('p_antwoord_'+i);return el?el.value.trim():'';});
  if(!antwoorden.some(function(a){return a;})){if(st)st.textContent='Beantwoord minstens één vraag.';return;}
  if(st)st.textContent='De AI schrijft het profiel… (kan ~15 sec duren)';
  var tok=getToken();
  fetch('/api/persona/genereer',{method:'POST',headers:{'Content-Type':'application/json','Authorization':tok?'Bearer '+tok:''},body:JSON.stringify({naam:naam,vragen:_wizardVragen,antwoorden:antwoorden})})
    .then(function(r){return r.json();})
    .then(function(j){
      if(j.error&&j.error.indexOf('DASHBOARD_TOKEN')!==-1){showLogin();return;}
      if(!j.ok){if(st)st.textContent='Fout: '+(j.error||'');return;}
      document.getElementById('p_icoon').value=j.icoon||'';
      document.getElementById('p_trefwoord').value=j.trefwoord||'';
      document.getElementById('p_prompt').value=j.systemPrompt||'';
      updateIconPreview();
      document.getElementById('p_wizard_vragen').innerHTML='';
      _wizardVragen=[];
      if(st)st.textContent='Profiel gegenereerd ✓ — controleer, pas aan waar nodig en klik Opslaan.';
    })
    .catch(function(){if(st)st.textContent='Fout bij het genereren.';});
}
function updateIconPreview(){
  var inp=document.getElementById('p_icoon');var img=document.getElementById('p_icoon_preview');
  if(!inp||!img)return;
  var v=inp.value.trim();
  if(/^https?:\/\//i.test(v)){img.src=v;img.style.display='';img.onerror=function(){img.style.display='none';};}
  else{img.style.display='none';img.removeAttribute('src');}
}

  document.getElementById('p_icoon').value=p.icoon||'';
  document.getElementById('p_trefwoord').value=p.trefwoord||'';
  document.getElementById('p_prompt').value=p.systemPrompt||'';
  document.getElementById('p_ongevraagd').checked=!!p.ongevraagd;
  document.getElementById('p_actief').checked=p.actief!==false;
  var st=document.getElementById('p_status');if(st)st.textContent='Bewerkt: '+p.naam;
  updateIconPreview();
  document.getElementById('k-persona-nieuw').scrollIntoView({block:'start',behavior:'smooth'});
}
function personaAnnuleer(){
  document.getElementById('p_id').value='';
  ['p_naam','p_icoon','p_trefwoord','p_prompt'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('p_ongevraagd').checked=false;
  document.getElementById('p_actief').checked=true;
  var st=document.getElementById('p_status');if(st)st.textContent='';
  document.getElementById('p_wizard_vragen').innerHTML='';
  _wizardVragen=[];
  updateIconPreview();
}

    id:document.getElementById('p_id').value||undefined,
    naam:naam,
    icoon:document.getElementById('p_icoon').value.trim(),

    actief:document.getElementById('p_actief').checked,

  setTimeout(tick,800);
}
function personaVerwijder(id){
  var p=_personas[id];if(!p)return;
  if(!confirm('Persona "'+p.naam+'" verwijderen?'))return;
  post('/api/persona/delete',{id:id},'Verwijderd','p_status');
  setTimeout(tick,800);
}

// ── één gedelegeerde listener per soort gebeurtenis; knoppen dragen hun gegevens in data-* ──
const DOE={effectStop:x=>regieStop(x.id),verrassingStop:()=>regieVerrassingStop(),zaakStop:()=>regieZaakStop(),niveau:x=>nbNiveau(x.v),
  score:x=>scoreDelta(x.id,+x.delta),ban:x=>banActie(x.id,x.wat),winkelWeg:x=>winkelVerwijder(x.id,x.item),gokpauze:x=>gokpauzeOpheffen(x.id,x.naam),
  bonus:()=>casinoBonus(),skip:x=>skip(x.soort,x.key,+x.ts||0,x.id||''),
  pTerug:x=>gastTerug(x.id),pBewerk:x=>personaBewerk(x.id),pSchakel:x=>personaSchakel(x.id),pVerwijder:x=>personaVerwijder(x.id)};
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href^="#"]');
  if(a){const id=a.getAttribute('href').slice(1);if(id){e.preventDefault();ga(id)}return}
  const b=e.target.closest('button');if(!b)return;const ds=b.dataset;
  if(ds.tbl){const box=$(`.chart[data-c="${ds.tbl}"]`),on=box.dataset.mode!=='table';box.dataset.mode=on?'table':'';
    b.setAttribute('aria-pressed',on);b.textContent=on?'Grafiek':'Tabel';draw(box,true);return}
  if('save' in ds)bewaar();
  else if('test' in ds)testPrompt();
  else if(ds.verkondig)verkondig(ds.verkondig);
  else if('eer' in ds)eerGeef();
  else if(ds.winkel)winkelBeheer(ds.winkel);
  else if(ds.actie)doeActie(ds.actie);
  else if(ds.do&&DOE[ds.do])DOE[ds.do](ds);
  else if('personaSave' in ds)personaOpslaan();
  else if('personaCancel' in ds)personaAnnuleer();
  else if('personaVragen' in ds)personaVragen();
  else if('personaGenereer' in ds)personaGenereer();
  else if('gastUitnodigen' in ds)gastUitnodigen();
});
document.addEventListener('change',e=>{const id=e.target.id;
  if(id==='i_regieNiveau')nbNiveau(e.target.value);else if(id==='g_bestand')gastBestandGekozen();else if(id==='p_bestand')personaBestandGekozen()});
document.addEventListener('input',e=>{const id=e.target.id;
  if(id==='i_decreetInt'){const p=$('#i_decreetIntPct');if(p)p.textContent=e.target.value+'%'}else if(id==='p_icoon')updateIconPreview();else if(id==='logzoek')filterLogs()});

show(location.hash.slice(1)||(()=>{try{return localStorage.getItem('dash_sec')}catch(_){return null}})()||'live');
setInterval(()=>{fresh++;tel()},1000);
tick();setInterval(tick,15000);
</script>
